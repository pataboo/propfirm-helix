<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELIX — 프랍펌 데이터베이스</title>
<meta name="description" content="프랍펌(prop firm) 참가비·수익분배·낙폭·규칙을 단계별로 기록하고 비교하는 데이터베이스. Prop firm comparison on recorded numbers.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--line2:#d1d5db;
    --bg:#fff;--bg2:#f9fafb;--pink:#e74694;--cyan:#00e5ff;--purple:#8d62f9;--blue:#2265f2;
    --green:#74d5a0;--greenink:#046c4e;--red:#ec6652;--yellow:#faca15;--yellowink:#8a6100;--r:12px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:1360px;margin:0 auto;padding:0 24px}
  .top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
  .top .wrap{display:flex;align-items:center;gap:16px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand .dot{width:9px;height:9px;border-radius:9999px;background:var(--pink);box-shadow:0 0 0 4px rgba(231,70,148,.18)}
  .brand small{font-weight:500;font-size:12px;color:#9ca3af;letter-spacing:0}
  .top .spacer{flex:1}
  .top .meta{font-size:12.5px;color:#9ca3af;display:flex;gap:18px}
  .top .meta b{color:#fff;font-weight:600}
  .lang{display:flex;border:1px solid #374151;border-radius:9999px;overflow:hidden}
  .lang button{background:transparent;border:0;color:#9ca3af;font:inherit;font-size:12px;font-weight:700;
    padding:6px 13px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--ink)}
  .hero{padding:34px 0 4px}
  h1{margin:0 0 10px;font-size:32px;line-height:1.2;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;color:var(--pink)}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;max-width:720px;line-height:1.65}
  .sub b{color:var(--ink2);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat{border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--purple)}
  .stat:nth-child(2)::after{background:var(--cyan)}.stat:nth-child(3)::after{background:var(--pink)}
  .stat:nth-child(4)::after{background:var(--yellow)}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
  .bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;border:1px solid var(--line2);
    border-radius:9999px;padding:9px 16px;background:#fff}
  .search input{border:0;outline:0;font:inherit;font-size:14px;width:100%;background:transparent;color:var(--ink)}
  .search input::placeholder{color:#9ca3af}
  .chip{border:1px solid var(--line2);background:#fff;border-radius:9999px;padding:8px 15px;font-size:13px;
    font-weight:600;color:var(--ink2);cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .chip:hover{border-color:#9ca3af;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .count{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .scroll{overflow:auto;max-height:72vh}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:1080px}
  thead th{position:sticky;top:0;background:var(--bg2);text-align:left;font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);
    white-space:nowrap;cursor:pointer;user-select:none;z-index:5}
  thead th:hover{color:var(--ink)}
  thead th.num{text-align:right}
  th .ar{color:var(--pink);font-size:9px;margin-left:3px}
  tbody td{padding:11px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle;white-space:nowrap}
  tbody td.num{text-align:right}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even){background:#fcfcfd}
  tbody tr:hover{background:#f5f7fb}
  tbody tr.sel{background:#fdf2f8}
  .cb{width:15px;height:15px;accent-color:var(--pink);cursor:pointer}
  .firm{font-weight:700;letter-spacing:-.01em}
  .prod{color:var(--ink2);max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .mono{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:9999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .p-verified{background:rgba(116,213,160,.2);color:var(--greenink)}
  .p-review{background:rgba(250,202,21,.22);color:var(--yellowink)}
  .p-unknown{background:#f3f4f6;color:#6b7280}
  .p-fail{background:rgba(236,102,82,.16);color:#b42318}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em}
  .t-CFD{background:rgba(34,101,242,.1);color:var(--blue)}
  .t-Futures{background:rgba(141,98,249,.13);color:#6d3ff0}
  .t-Crypto{background:rgba(0,229,255,.18);color:#00707c}
  .t-Stocks{background:rgba(231,70,148,.1);color:#b32a68}
  .t-Synthetic{background:#f3f4f6;color:#6b7280}
  .dim{color:#9ca3af}
  .empty{padding:46px;text-align:center;color:var(--muted)}
  footer{padding:24px 0 96px;color:var(--muted);font-size:12.5px;line-height:1.75;max-width:940px}
  footer b{color:var(--ink2)}
  footer code{background:#f3f4f6;padding:1px 5px;border-radius:5px;font-size:11.5px}
  .tray{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 0;
    transform:translateY(120%);transition:transform .22s ease;z-index:50}
  .tray.on{transform:translateY(0)}
  .tray .wrap{display:flex;align-items:center;gap:12px}
  .tray .slots{display:flex;gap:8px;flex:1;overflow:hidden}
  .slot{border:1px dashed #4b5563;border-radius:9999px;padding:6px 12px;font-size:12px;color:#9ca3af;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.filled{border:1px solid #6b7280;color:#fff;background:#1f2937;font-weight:600}
  .btn{background:var(--pink);color:#fff;border:0;border-radius:9999px;padding:10px 20px;font-weight:700;
    font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid #4b5563;color:#d1d5db}
  .mod{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;z-index:60;padding:32px 16px;overflow:auto}
  .mod.on{display:block}
  .mod .panel{background:#fff;border-radius:16px;max-width:1120px;margin:0 auto;overflow:hidden}
  .mod .head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);gap:12px}
  .mod .head h2{margin:0;font-size:17px;letter-spacing:-.02em}
  .mod .head .x{margin-left:auto;border:0;background:#f3f4f6;border-radius:9999px;width:32px;height:32px;
    font-size:15px;cursor:pointer;color:var(--ink2)}
  .cmp{overflow-x:auto}
  .cmprow{display:grid;grid-template-columns:170px repeat(var(--cols),minmax(180px,1fr));border-bottom:1px solid #f3f4f6}
  .cmprow > div{padding:10px 14px;font-size:13px;white-space:nowrap}
  .cmprow .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    background:var(--bg2);display:flex;align-items:center;position:sticky;left:0}
  .cmprow .v{font-weight:500}
  .cmprow .v.diff{background:#fff5fa;font-weight:700;color:var(--ink)}
  .cmphead .v{font-weight:800;font-size:13.5px;padding-top:14px;padding-bottom:14px;white-space:normal}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}
    .top .meta{display:none}.cmprow{grid-template-columns:130px repeat(var(--cols),minmax(150px,1fr))}}
</style></head><body>

    fFirm:"Firm", fProd:"Product", fAsset:"Asset", fSize:"Account size", fEntry:"Entry fee",
    fAct:"Activation fee", fTotal:"Total known", fSplit:"Profit split", fMax:"Max loss",
    fDD:"Drawdown type", fTarget:"Target", fDays:"Min days", fCycle:"Payout cycle",
    fNews:"News trading", fStatus:"Status", fId:"Offer ID",
    st_unknown:"Unknown", st_unrev:"Unreviewed", st_rev:"Reviewed", st_third:"3rd-party", st_fail:"Fails",
    a_CFD:"CFD", a_Futures:"Futures", a_Crypto:"Crypto", a_Stocks:"Stocks", a_Synthetic:"Synthetic",
    v_unknown:"unknown", v_allowed:"allowed", v_conditional:"conditional", v_notallowed:"not allowed", v_na:"n/a",
    foot:'<b>Where this comes from.</b> Canonical data lives in the HELIX Google Sheet (<code>07_All_Fields</code> → <code>1. Explore</code>); this page is a read-only view of that export and never writes back. Nothing here is buy-ready certification until <code>10_Evidence</code> carries the official source. Verify any rule on the firm\'s own site before funding.<br><br><b>Previous version</b> preserved at tag <code>archive/pre-pfm-ui-2026-11-14</code>.'
  }
};
let lang = (localStorage.getItem("helix-lang") || "ko");
let q="", asset="all", sortKey="firm", sortDir=1;
const sel = new Set();
const el = id => document.getElementById(id);
const t = k => (I18N[lang][k] ?? k);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const raw = v => (v==null)?"":String(v).trim();
const isUnknown = v => !raw(v) || raw(v).toLowerCase()==="unknown" || raw(v)==="—";
const num = v => { const n = Number(String(v).replace(/[,$%\s]/g,"")); return isNaN(n)?-Infinity:n; };

function vEnum(v){
  const s = raw(v).toLowerCase();
  if (!s || s==="unknown") return `<span class="dim">${t("v_unknown")}</span>`;
  if (s==="allowed") return esc(t("v_allowed"));
  if (s==="conditional") return esc(t("v_conditional"));
  if (/not_allowed|prohibited|forbidden/.test(s)) return esc(t("v_notallowed"));
  if (s==="—"||s==="n/a") return `<span class="dim">${t("v_na")}</span>`;
  return esc(raw(v));
}
function assetLabel(a){ return t("a_"+a) || a; }
function statusOf(s){
  const x = raw(s).toLowerCase();
  if(!x || x==="unknown") return ["st_unknown","p-unknown"];
  if(x.includes("fail")) return ["st_fail","p-fail"];
  if(x.includes("legacy_unreview")) return ["st_unrev","p-unknown"];
  if(x.includes("third_party")) return ["st_third","p-review"];
  if(x.includes("candidate")||x.includes("review")) return ["st_rev","p-review"];
  if(x.includes("verif")) return ["st_rev","p-verified"];
  return ["st_unknown","p-unknown"];
}
const pct = v => isUnknown(v) ? `<span class="dim">${t("unknown")}</span>`
  : `<span class="mono">${esc(raw(v))}${/%/.test(raw(v))?"":"%"}</span>`;
const money = (v,cur) => {
  if(isUnknown(v)) return `<span class="dim">${t("unknown")}</span>`;
  const x = raw(v);
  if(/^\d+(\.\d+)?$/.test(x)){
    const sym = raw(cur).toUpperCase()==="USD" ? "$" : "";
    return `<span class="mono">${sym}${Number(x).toLocaleString('en-US')}</span>`;
  }
  return `<span class="mono">${esc(x)}</span>`;
};
const days = v => (isUnknown(v)||raw(v)==="0") ? '<span class="dim">—</span>' : `<span class="mono">${esc(raw(v))}</span>`;
const sizeCell = r => {
  if(isUnknown(r.size)) return '<span class="dim">—</span>';
  const n = Number(String(r.size).replace(/[,$\s]/g,""));
  const sym = raw(r.cur).toUpperCase()==="USD" ? "$" : "";
  return `<span class="mono">${isNaN(n)?esc(r.size):sym+n.toLocaleString('en-US')}</span>`;
};

function applyStatics(){
  document.documentElement.lang = lang;
  document.title = lang==="ko" ? "HELIX — 프랍펌 데이터베이스" : "HELIX — prop firm database";
  el("brandSub").textContent = t("brandSub");
  el("moffersL").textContent = t("offers"); el("mfirmsL").textContent = t("firms"); el("mdate").textContent = t("date");
  el("h1").innerHTML = `${esc(t("h1a"))}<em>${esc(t("h1b"))}</em>${esc(t("h1c"))}`;
  el("sub").innerHTML = t("sub");
  ["l1","l2","l3","l4"].forEach((id,i)=>el(id).textContent = t("l"+(i+1)));
  el("q").placeholder = t("search");
  el("chipAll").textContent = t("allAssets");
  el("thFirm").textContent=t("firm"); el("thProd").textContent=t("product"); el("thAsset").textContent=t("asset");
  el("thSize").textContent=t("size"); el("thEntry").textContent=t("entry"); el("thAct").textContent=t("act");
  el("thSplit").textContent=t("split"); el("thMax").textContent=t("maxloss"); el("thTarget").textContent=t("target");
  el("thDays").textContent=t("days"); el("thStatus").textContent=t("status");
  el("empty").textContent = t("emptyTr");
  el("foot").innerHTML = t("foot");
  el("trayLabel").textContent = t("tray"); el("clear").textContent = t("clear");
  el("modTitle").textContent = t("modTitle");
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  el("s1").textContent = rows.length.toLocaleString();
  el("s2").textContent = DB.firms.length;
  el("s3").textContent = DB.assets.length;
  el("s4").textContent = 96;
  el("moffers").textContent = rows.length.toLocaleString();
  el("mfirms").textContent = DB.firms.length;
  buildAssetChips();
}

function buildAssetChips(){
  const cw = el("assetChips"); cw.innerHTML="";
  DB.assets.forEach(a=>{
    const b=document.createElement("button");
    b.className="chip"+(asset===a?" on":""); b.textContent=assetLabel(a); b.dataset.asset=a;
    b.onclick=()=>{ asset=a; render(); };
    cw.appendChild(b);
  });
  el("chipAll").classList.toggle("on", asset==="all");
}

function render(){
  const out = rows.filter(r=>{
    if(asset!=="all" && r.asset!==asset) return false;
    if(!q) return true;
    return (r.firm+" "+r.prod+" "+r.id+" "+r.asset).toLowerCase().includes(q);
  }).sort((a,b)=>{
    const A=raw(a[sortKey]), B=raw(b[sortKey]);
    if(["size","efee","afee","split","days"].includes(sortKey)) return (num(A)-num(B))*sortDir;
    return A.localeCompare(B)*sortDir;
  });
  el("tb").innerHTML = out.map(r=>{
    const [sk,cls] = statusOf(r.review);
    const on = sel.has(r.id);
    return `<tr class="${on?"sel":""}">
      <td><input type="checkbox" class="cb" data-id="${esc(r.id)}" ${on?"checked":""} aria-label="compare"></td>
      <td class="firm">${esc(r.firm)||'<span class="dim">—</span>'}</td>
      <td class="prod" title="${esc(r.prod)}">${esc(r.prod)||'<span class="dim">—</span>'}</td>
      <td><span class="tag t-${esc(r.asset)}">${esc(assetLabel(r.asset))}</span></td>
      <td class="num">${sizeCell(r)}</td>
      <td class="num">${money(r.efee,r.cur)}</td>
      <td class="num">${money(r.afee,r.cur)}</td>
      <td class="num">${pct(r.split)}</td>
      <td>${pct(r.maxloss)}</td>
      <td>${pct(r.target)}</td>
      <td class="num">${days(r.days)}</td>
      <td><span class="pill ${cls}">${esc(t(sk))}</span></td>
    </tr>`;
  }).join("");
  document.querySelectorAll(".cb").forEach(cb=>cb.onchange=()=>{
    const id=cb.dataset.id;
    if(cb.checked){ if(sel.size>=4){cb.checked=false;return;} sel.add(id);} else sel.delete(id);
    render(); renderTray();
  });
  document.querySelectorAll("thead th[data-sort]").forEach(th=>{
    th.querySelectorAll(".ar").forEach(a=>a.remove());
    if(th.dataset.sort===sortKey){
      const s=document.createElement("span"); s.className="ar"; s.textContent=sortDir>0?"▲":"▼"; th.appendChild(s);
    }
  });
  el("empty").style.display = out.length?"none":"block";
  el("count").textContent = `${out.length.toLocaleString('en-US')}${t("of")}${rows.length.toLocaleString('en-US')}${t("offersWord")}`;
  buildAssetChips();
}

function renderTray(){
  const arr=[...sel];
  el("tray").classList.toggle("on", arr.length>0);
  const slots=[];
  for(let i=0;i<4;i++){
    const r = rows.find(x=>x.id===arr[i]);
    slots.push(r?`<span class="slot filled">${esc(r.firm)} · ${esc(r.prod)}${r.size?" · "+esc(r.size):""}</span>`
               :`<span class="slot">${lang==="ko"?"비어 있음":"empty"}</span>`);
  }
  el("slots").innerHTML=slots.join("");
  el("go").disabled = arr.length<2;
  el("go").textContent = arr.length<2 ? t("pick") : `${t("compareN")} ${arr.length}`;
}

function openCompare(){
  const arr=[...sel].map(id=>rows.find(r=>r.id===id)).filter(Boolean);
  if(arr.length<2) return;
  const F=[
    [t("fFirm"), r=>esc(r.firm)],
    [t("fProd"), r=>esc(r.prod)],
    [t("fAsset"), r=>esc(assetLabel(r.asset))],
    [t("fSize"), r=>sizeCell(r)],
    [t("fEntry"), r=>money(r.efee,r.cur)],
    [t("fAct"), r=>money(r.afee,r.cur)],
    [t("fTotal"), r=>money(r.tfee,r.cur)],
    [t("fSplit"), r=>pct(r.split)],
    [t("fMax"), r=>pct(r.maxloss)],
    [t("fDD"), r=>vEnum(r.dd)],
    [t("fTarget"), r=>pct(r.target)],
    [t("fDays"), r=>days(r.days)],
    [t("fCycle"), r=>isUnknown(r.cycle)?`<span class="dim">${t("unknown")}</span>`:esc(r.cycle)],
    [t("fNews"), r=>vEnum(r.news)],
    [t("fStatus"), r=>{const [sk,cls]=statusOf(r.review);return `<span class="pill ${cls}">${esc(t(sk))}</span>`;}],
    [t("fId"), r=>`<span class="dim" style="font-size:11px">${esc(r.id)}</span>`]
  ];
  el("cmp").style.setProperty("--cols", arr.length);
  el("cmp").innerHTML =
    `<div class="cmprow cmphead"><div class="k">${esc(t("field"))}</div>` +
    arr.map(r=>`<div class="v">${esc(r.firm)}<div style="font-weight:500;font-size:12px;color:#6b7280">${esc(r.prod)}${r.size?" · "+esc(r.size):""}</div><div style="font-weight:500;font-size:11px;color:#9ca3af">${esc(r.id)}</div></div>`).join("") +
    `</div>` +
    F.map(([k,f])=>{
      const vals = arr.map(f);
      const diff = vals.some(v=>v!==vals[0]);
      return `<div class="cmprow"><div class="k">${esc(k)}</div>` +
             vals.map(v=>`<div class="v${diff?" diff":""}">${v}</div>`).join("") + `</div>`;
    }).join("");
  el("mod").classList.add("on");
}

el("go").onclick = openCompare;
el("clear").onclick = ()=>{ sel.clear(); render(); renderTray(); };
el("close").onclick = ()=>el("mod").classList.remove("on");
el("mod").onclick = e=>{ if(e.target.id==="mod") el("mod").classList.remove("on"); };
el("chipAll").onclick = ()=>{ asset="all"; render(); };
el("q").addEventListener("input", e=>{ q=e.target.value.toLowerCase().trim(); render(); });
document.querySelectorAll("thead th[data-sort]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
  render();
});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  lang = b.dataset.lang; localStorage.setItem("helix-lang", lang);
  applyStatics(); render(); renderTray();
  if(el("mod").classList.contains("on")) openCompare();
});
applyStatics(); renderTray(); render();
</script>
</body></html>
