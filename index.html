/* ---------- notes ---------- */
/* Rule-based KO summary: pull target / loss / split / payout segments out of the
   recorded note and show them under Korean labels; the full recorded text stays
   available behind a native <details> fold. No translation API, no paraphrase —
   every value shown is a substring of the recorded note. */
const NOTE_CAT=[
  {k:"nsumTarget", strip:/^(?:목표|profit[\s-]*target|\btargets?\b)\s*[:：]?\s*/i,
   re:/(?:목표|profit[\s-]*target|\btargets?\b)\s*[:：]?\s*[^|·]{0,34}/gi},
  {k:"nsumLoss",   keepKw:true, needDigit:true,
   re:/(?:일일\s*(?:손실|최대)?|daily\s*(?:loss|drawdown)?|max(?:imum)?\s*(?:loss|drawdown)?|최대\s*손실)\s*[:：]?\s*[^|·]{0,30}/gi},
  {k:"nsumSplit",  strip:/^(?:분배|배분|profit[\s-]*(?:split|share)|\bsplit\b)\s*[:：]?\s*/i,
   re:/(?:분배|배분|profit[\s-]*(?:split|share)|\bsplit\b)\s*[:：]?\s*[^|·]{0,34}/gi},
  {k:"nsumPay",    strip:/^(?:첫\s*지급|지급|payouts?|payments?)\s*[:：]?\s*/i,
   re:/(?:첫\s*지급|지급|payouts?|payments?|performance[\s-]*fee|reward\s*on\s*demand)\s*[:：]?\s*[^|·]{0,40}/gi}
];
/* Trim a matched phrase down to something readable without inventing anything:
   drop long provenance parentheses, trailing source clauses and sentence tails. */
function noteValFrom(m){
  let v=String(m).replace(/\s+/g," ").trim();
  v=v.split(/\s+[—–]\s+/)[0];
  v=v.replace(/\([^)]{15,}\)/g,"").replace(/\s*\([^)]*$/,"");   // long provenance parens + cut-open parens
  v=v.split(/\.\s/)[0];
  if(!/\[/.test(v)) v=v.split(/[,;]\s/)[0];                      // keep "[8.0, 5.0]" targets intact
  v=v.replace(/[\s·,:;.、]+$/,"").trim();
  if(v.length>46) v=v.slice(0,44).replace(/[\s·,]+$/,"")+"…";
  return v.trim();
}
function noteSummary(txt){
  const parts=String(txt).split(/\s*\|\s*/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const c of NOTE_CAT){
    const hits=[];
    for(const p of parts){
      c.re.lastIndex=0;
      let m;
      while((m=c.re.exec(p))!==null){
        let v=noteValFrom(m[0]);
        if(!v || v.length<2) { if(c.re.lastIndex>=p.length) break; continue; }
        if(!/\d/.test(v)){                      // "100% 분배" → take the figure just before the keyword
          const pre=p.slice(0,m.index).match(/([$€£₩]?\s?\d[\d.,]*\s*%?)\s*$/);
          if(pre) v=pre[1].trim();
        }
        if(c.needDigit && !/\d/.test(v)) continue;
        if(c.strip && !c.keepKw) v=v.replace(c.strip,"").trim();
        if(m.index+m[0].length<p.length && v.length>18 && !/[.!?%…]$/.test(v)) v=v+"…";  // excerpt cut mid-phrase
        if(!v || /^[)\]]/.test(v) || (v.includes(")") && !v.includes("("))) continue;  // broken fragment
        const core=s=>s.replace(/\([^)]*\)/g,"").replace(/\s+/g,"").toLowerCase();
        const c2=core(v); if(!c2) continue;
        const dup=hits.findIndex(h=>{const hc=core(h); return hc===c2||hc.includes(c2)||c2.includes(hc);});
        if(dup>=0){ if(core(hits[dup]).length<c2.length) hits[dup]=v; continue; }
        hits.push(v);
        if(c.re.lastIndex>=p.length) break;
      }
    }
    if(!hits.length) continue;
    let v=hits[0];
    if(hits[1] && (v+" · "+hits[1]).length<=84) v=v+" · "+hits[1];
    out.push({k:c.k, v, warn:/⚠|미검증|불가|금지|not allowed|forbidden/i.test(hits.join(" "))});
  }
  return out;
}

    F.target,F.sizeMin,F.sizeMax,F.priceMax,F.splitMin,F.daysBand,F.levBand,F.ratingMin,q,sortPreset]);
}
function matches(r){
  if(q){
    const pay=(DB.pay&&DB.pay[r.f]&&DB.pay[r.f].methods||[]).join(" ");
    const plat=(DB.eap&&DB.eap[r.f]&&DB.eap[r.f].platforms||[]).join(" ");
    const hay=[r.f,r.p,r.pm,r.co,r.pt,r.pc,r.dd,r.no,r.sy,r.mlT,r.tgT,pay,plat].filter(Boolean).join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(favOnly && !favs.has(r.i)) return false;
  if(F.firm.size&&!F.firm.has(r.f))return false;
  if(F.mk.size&&!F.mk.has(r.mk))return false;
  if(F.st.size&&!F.st.has(r.st||"—"))return false;
  if(F.dd.size&&!F.dd.has(r.ddc||"—"))return false;
  if(F.vf.size&&!F.vf.has(r.vf||"—"))return false;
  for(const f of F.flags){ if(!flagOk(r,f)) return false; }
  const s=num(r.s); if(F.sizeMin!=null&&(s==null||s<F.sizeMin))return false;
  if(F.sizeMax!=null&&(s==null||s>F.sizeMax))return false;
  const pr=num(r.pr); if(F.priceMax!=null&&(pr==null||pr>F.priceMax))return false;
  if(F.cycle.size&&!F.cycle.has(r.pcc||"—"))return false;
  const dl=num(r.dl); if(F.dailyMax!=null&&(dl==null||dl>F.dailyMax))return false;
  const ml=num(r.ml); if(F.maxlossMax!=null&&(ml==null||ml>F.maxlossMax))return false;
  const sp=num(r.sp); if(F.splitMin!=null&&(sp==null||sp<F.splitMin))return false;
  const dy=num(r.mf??r.md); if(F.daysMax!=null&&(dy==null||dy>F.daysMax))return false;
  const lv=num(r.lv); if(F.levMin!=null&&(lv==null||lv<F.levMin))return false;
  if(F.fee.size && !F.fee.has(feeClass(r))) return false;
  if(F.paym && F.paym.size){ const pm=payMethods(r); if(![...F.paym].some(k=>pm.includes(k))) return false; }
  if(F.plat && F.plat.size){ const e=(DB.eap||{})[r.f]; const ps=(e&&e.platforms)||[];
    if(![...F.plat].some(k=>ps.includes(k))) return false; }

  if(F.target==="yes" && !(num(r.tg)>0))return false;
  if(F.target==="no"  && (num(r.tg)>0))return false;
  if(F.target && /^\d+$/.test(F.target) && !(num(r.tg)>=Number(F.target)))return false;
  if(F.daysBand){ const d2=num(r.mf??r.md);
    if(d2==null) return false;
    if(F.daysBand==="zero" && d2!==0) return false;
    if(F.daysBand==="low"  && !(d2>=1&&d2<=5)) return false;
    if(F.daysBand==="high" && d2<=5) return false; }
  if(F.levBand){ const l3=num(String(r.lv||r.lvp||"").replace("1:",""));
    if(l3==null) return false;
    if(F.levBand==="low" && l3>30) return false;
    if(F.levBand==="mid" && !(l3>30&&l3<=100)) return false;
    if(F.levBand==="high"&& l3<=100) return false; }
  if(F.rtsrc.size){
    const x=ratingsOf(r.f);
    const has=[...F.rtsrc].some(k=>x[k]&&(x[k].r!=null||x[k].warn));
    if(!has) return false;
  }
  if(F.ratingMin!=null){
    const x=ratingsOf(r.f);
    const srcs=F.rtsrc.size?[...F.rtsrc]:["pfm","tp","sj","feefo"];
    const vals=srcs.map(k=>(x[k]&&x[k].r!=null)?Number(x[k].r):null).filter(v=>v!=null);
    const best=vals.length?Math.max(...vals):(num(r.rt));
    if(best==null||best<F.ratingMin) return false;
  }
  return true;
}

function buildFilterSettings(){
  const box=el("filterSettings"); if(!box) return;
  const NAMES={firm:t("firm"),mk:t("mkt"),st:t("step"),size:t("size"),price:t("price"),split:t("fSplit"),
    dd:t("ddF"),flags:t("flags"),ver:t("ver"),cycle:t("fCycleL"),target:t("fTarget"),days:t("fDays"),fee:lang==="ko"?"결제 유형":"Payment",
    lev:t("fLev"),rating:t("fRating"),
    paym:lang==="ko"?"지급 방식":"Payout method", plat:lang==="ko"?"플랫폼":"Platform"};
  box.innerHTML=`<div class="tshead">${lang==="ko"?"표시할 필터":"Visible filters"}</div>`+
    visGroups.concat(ALL_GROUPS.filter(g=>!visGroups.includes(g)))
      .map(g=>`<label class="tsrow draggable" draggable="true" data-drag="${g}">
        <span style="color:var(--muted);cursor:grab;padding-right:2px">⣿</span>
        <input type="checkbox" data-g="${g}" ${visGroups.includes(g)?"checked":""}> ${esc(NAMES[g]||g)}</label>`).join("")+
    `<div class="tsrow" id="fgReset" style="color:var(--accent);font-weight:700">${lang==="ko"?"초기화":"Reset"}</div>`;
  box.querySelectorAll("[data-g]").forEach(cb=>cb.onchange=()=>{
    const g=cb.dataset.g;
    visGroups = cb.checked ? [...new Set([...visGroups,g])] : visGroups.filter(x=>x!==g);
    localStorage.setItem("helix-groups",JSON.stringify(visGroups)); buildFilters();
  });
  let dragKey=null;
  box.querySelectorAll("[data-drag]").forEach(row=>{
    row.ondragstart=e=>{ dragKey=row.dataset.drag; row.style.opacity=".4"; e.dataTransfer.effectAllowed="move"; };
    row.ondragend=()=>{ row.style.opacity="1"; dragKey=null;
      box.querySelectorAll("[data-drag]").forEach(r=>r.style.borderTop=""); };
    row.ondragover=e=>{ e.preventDefault(); if(!dragKey||dragKey===row.dataset.drag) return;
      box.querySelectorAll("[data-drag]").forEach(r=>r.style.borderTop=""); row.style.borderTop="2px solid var(--accent)"; };
    row.ondrop=e=>{ e.preventDefault(); if(!dragKey||dragKey===row.dataset.drag) return;
      const from=visGroups.indexOf(dragKey); if(from<0) return;
      visGroups.splice(from,1);

      localStorage.setItem("helix-groups",JSON.stringify(visGroups));
      buildFilterSettings(); buildFilters(); };
  });
  const r=el("fgReset"); if(r) r.onclick=()=>{visGroups=ALL_GROUPS.slice();
    localStorage.setItem("helix-groups",JSON.stringify(visGroups)); buildFilterSettings(); buildFilters();};
}
/* A11Y: keep keyboard focus on the same filter control across re-renders */
function focusSig(a){
  if(!a||a===document.body||a===document.documentElement) return null;
  const d=a.dataset||{}, escv=s=>String(s).replace(/["\\]/g,"\\$&");
  if(d.k!=null&&d.v!=null) return {sel:`#filterPanel input[type="checkbox"][data-k="${escv(d.k)}"][data-v="${escv(d.v)}"]`};
  if(a.id) return {sel:`#${CSS.escape(a.id)}`};
  for(const k of ["size","preset","fee","split","target","days","lev","rating","sort","view"]){
    if(d[k]!=null) return {sel:`#filterPanel [data-${k}="${escv(d[k])}"]`};
  }
  return null;
}
function restoreFocus(sig){
  if(!sig) return;
  const t=document.querySelector(sig.sel);
  if(t&&t!==document.activeElement) t.focus({preventScroll:true});
}
function fapply(){ const s=focusSig(document.activeElement); render(); restoreFocus(s); }

function vsMetrics(){
  const sc=vsScrollEl(); if(!sc) return null;
  const rect=sc.getBoundingClientRect();
  const content=VS.out.length*VS.rowH;
  /* when the container scrolls itself, scrollTop is the offset; when it is
     taller than the viewport (<=760px) the page scrolls instead */
  const pageHidden=Math.max(0,-rect.top);
  let top=sc.scrollTop+pageHidden;
  top=Math.max(0, Math.min(top, Math.max(0,content-VS.rowH)));
  const availTop=Math.max(0,rect.top);
  const availBot=Math.min(window.innerHeight, rect.bottom);
  const h=Math.max(160, availBot-availTop);
  return {top,h};
}
function vsWireRows(tb){

    tr.onclick=()=>openDrawer(tr.dataset.id);

function vsPaint(force,nomeasure){
  const tb=el("tb"); if(!tb) return;
  const out=VS.out, n=out.length;
  const table=tb.closest("table");
  if(table) table.setAttribute("aria-rowcount", String(n+1));
  if(!n){ VS.start=VS.end=0; tb.innerHTML=""; return; }
  const m=vsMetrics(); if(!m) return;
  const per=Math.max(1, Math.ceil(m.h/VS.rowH));
  let start=Math.max(0, Math.floor(m.top/VS.rowH)-VS.buf);
  start=Math.min(start, Math.max(0, n-per-VS.buf));
  let end=Math.min(n, start+per+VS.buf*2+2);
  /* never drop the row that has keyboard focus out of the DOM */
  const fIdx=VS.focusId?out.findIndex(r=>r.i===VS.focusId):-1;
  if(fIdx>=0&&(fIdx<start||fIdx>=end)){ start=Math.max(0, fIdx-VS.buf); end=Math.min(n, start+per+VS.buf*2+2); }
  if(!force && start===VS.start && end===VS.end) return;
  const ae=document.activeElement;
  const inTb=!!(ae && ae!==tb && tb.contains(ae));
  const fRow=inTb&&ae.closest?ae.closest("tr[data-id]"):null;
  const fid=fRow?fRow.dataset.id:null;
  const fFav=inTb&&ae.classList.contains("fav")?ae.dataset.fav:null;
  VS.start=start; VS.end=end;
  const pad=px=>`<tr class="vsPad" aria-hidden="true"><td colspan="20"><div style="height:${Math.max(0,Math.round(px))}px"></div></td></tr>`;
  tb.innerHTML=(start>0?pad(start*VS.rowH):"") +
    out.slice(start,end).map((r,i)=>vsRowHtml(r,start+i)).join("") +
    (end<n?pad((n-end)*VS.rowH):"");
  vsWireRows(tb);
  /* one measurement, then repaint the spacers with the true row height */
  if(!nomeasure){
    const tr0=tb.querySelector("tr[data-id]");
    if(tr0){ const hh=tr0.getBoundingClientRect().height;
      if(hh>12 && Math.abs(hh-VS.rowH)>0.5){ VS.rowH=hh; vsPaint(true,true); return; } }
  }
  if(fid){
    const tr=[...tb.querySelectorAll("tr[data-id]")].find(t=>t.dataset.id===fid);
    if(tr){
      if(fFav){ const b=tr.querySelector(".fav"); if(b) b.focus({preventScroll:true}); }
      else tr.focus({preventScroll:true});
    }
  }
}
function vsSetData(out){ VS.out=out; VS.start=VS.end=-1; vsPaint(true); }
let vsWired=false;
function vsFocusRow(idx){
  const out=VS.out; if(!out||!out.length) return false;
  idx=Math.max(0, Math.min(idx, out.length-1));
  const id=out[idx].i, sc=vsScrollEl();
  const find=()=>[...el("tb").querySelectorAll("tr[data-id]")].find(t=>t.dataset.id===id);
  let tr=find();
  const visible=!!(tr&&sc&&(()=>{const r=tr.getBoundingClientRect(), c=sc.getBoundingClientRect(); return r.top>=c.top+30&&r.bottom<=c.bottom;})());
  if(!visible&&sc){ sc.scrollTop=Math.max(0, idx*VS.rowH - VS.rowH*2); vsPaint(true); tr=find(); }
  if(!tr) return false;
  tr.focus({preventScroll:true});
  return true;
}
function vsWire(){
  if(vsWired) return; vsWired=true;
  const kick=()=>{ if(VS.raf) return; VS.raf=requestAnimationFrame(()=>{ VS.raf=0; vsPaint(false); }); };
  const sc=vsScrollEl(); if(sc) sc.addEventListener("scroll",kick,{passive:true});
  window.addEventListener("scroll",kick,{passive:true});
  window.addEventListener("resize",()=>{ vsPaint(true); });
  const tb=el("tb");
  if(tb) tb.addEventListener("focusin",e=>{
    const tr=e.target&&e.target.closest?e.target.closest("tr[data-id]"):null;
    VS.focusId=tr?tr.dataset.id:null;
  });
  /* keyboard: walk the whole result set even though only a window is in the DOM */
  if(tb) tb.addEventListener("keydown",e=>{
    const tr=e.target.closest?e.target.closest("tr[data-id]"):null;
    if(!tr) return;
    const idx=Number(tr.getAttribute("aria-rowindex"))-2;
    if(e.key==="ArrowDown"){ e.preventDefault(); vsFocusRow(idx+1); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); vsFocusRow(idx-1); return; }
    if(e.key==="PageDown"){ e.preventDefault(); vsFocusRow(idx+10); return; }
    if(e.key==="PageUp"){ e.preventDefault(); vsFocusRow(idx-10); return; }
    if(e.key!=="Tab") return;
    const rows=[...tb.querySelectorAll("tr[data-id]")]; if(!rows.length) return;
    const tail=row=>{const f=[...row.querySelectorAll("button,a")].filter(x=>x.tabIndex>=0); return f.length?f[f.length-1]:row;};
    if(!e.shiftKey && tr===rows[rows.length-1] && e.target===tail(tr) && VS.end<VS.out.length){
      e.preventDefault(); vsFocusRow(VS.end);
    } else if(e.shiftKey && tr===rows[0] && e.target===tr && VS.start>0){
      e.preventDefault(); vsFocusRow(VS.start-1);
    }
  });
}

function feeClass(r){
  const pr=Number(r.pr||0), ac=Number(r.ac||0), nm=(r.p||"")+" "+(r.pm||"");
  if(/pay\s*later|후불/i.test(nm) || (ac>0 && pr<=5)) return "later";
  if(pr===0) return "free";
  return "normal";
}

  {k:"buy",  ko:"★ 실구매 후보", en:"★ Shortlist", flags:["korea","tot"], vf:["A"]},
  {k:"kr",   ko:"한국 가능",     en:"Korea OK",    flags:["korea"]},
  {k:"tot",  ko:"총액 확인",     en:"Total known", flags:["tot"]},

  {k:"best", ko:"가성비 순",     en:"Best value",  sort:"pr"},
];
const pname=k=>{const p=PRESETS.find(x=>x.k===k); return p?(lang==="ko"?p.ko:p.en):k;};
function presetConds(p){
  return (p.flags||[]).map(v=>["flags",v])
    .concat((p.vf||[]).map(v=>["vf",v]))
    .concat((p.fee||[]).map(v=>["fee",v]));
}
function presetActive(p){
  const c=presetConds(p);
  return c.length>0 && c.every(([set,v])=>F[set].has(v));
}
function applyPreset(k){
  const p=PRESETS.find(x=>x.k===k); if(!p) return;
  if(p.sort){
    sortPreset = (sortPreset===k) ? null : k;
    if(sortPreset){ sortKey=p.sort; sortDir=1; const sel=el("sortSel"); if(sel) sel.value=sortKey; }
    fapply(); return;
  }
  const conds=presetConds(p);
  const on=presetActive(p);
  conds.forEach(([set,v])=>{ if(on) F[set].delete(v); else F[set].add(v); });
  // open the groups we just touched so the change is visible
  if(!on) conds.forEach(([set])=>{
    const g=document.querySelector(`#filterPanel details[data-g="${set}"]`); if(g) g.open=true;
  });
  fapply();
}
function flagOk(r,f){
  const ok=v=>v===true||v==="cond";
  if(f==="promo") return !!(r.co||r.pt);
  if(f==="ea")    return ok(r.ec);
  if(f==="news")  return ok(r.nc);
  if(f==="korea") return r.kr==="yes";
  if(f==="on")    return ok(r.oc);
  if(f==="cp")    return ok(r.cc);
  if(f==="wk")    return ok(r.wk);
  if(f==="tot")   return r.to!=null;

/* ---------- payout cycle: recorded text -> shortest interval in days ----------
   Only day/week/month words already present in the recorded cycle text are read.
   A row whose text carries no interval stays out of the ranking — nothing is guessed. */
function cycDays(v){
  if(v==null||v==="") return null;
  let t=String(v).toLowerCase()
    .replace(/(?:winning|qualifying|active trading|trading|profitable|profit)\s+days?/g," ");
  const d=[]; let m;
  if(/on[\s-]?demand|수시|instant|즉시|same[\s-]day/.test(t)) d.push(0);
  if(/\bdaily\b|매일|per (?:et )?(?:calendar )?day|per 24h|\b24h\b/.test(t)) d.push(1);
  let re=/(\d+(?:\.\d+)?)\s*(?:-|–|\/|~|or|,)\s*(\d+(?:\.\d+)?)\s*(?:business |calen\w+ )?(?:days?|일)/g;
  while((m=re.exec(t))){ d.push(Number(m[1]),Number(m[2])); }
  re=/(\d+(?:\.\d+)?)\s*(?:business |calen\w+ )?(?:days?|일|영업일)/g;
  while((m=re.exec(t))) d.push(Number(m[1]));
  re=/every\s+(\d+(?:\.\d+)?)/g;
  while((m=re.exec(t))) d.push(Number(m[1]));
  re=/(\d+(?:\.\d+)?)\s*(?:weeks?|주)/g;
  while((m=re.exec(t))) d.push(Number(m[1])*7);
  re=/(\d+(?:\.\d+)?)\s*months?/g;
  while((m=re.exec(t))) d.push(Number(m[1])*30);
  if(/bi-?weekly|격주/.test(t)) d.push(14);
  if(/\bweekly\b|매주/.test(t)) d.push(7);
  if(/monthly|매월/.test(t)) d.push(30);
  const ok=d.filter(x=>isFinite(x)&&x>=0);
  return ok.length?Math.min.apply(null,ok):null;
}
const cycLabel=d=>d===0?(lang==="ko"?"수시/즉시":"On demand")
  :d===1?(lang==="ko"?"매일":"Daily")

const PLAN={people:3, capital:100000, mk:"cfd", budget:1500, verifiedOnly:true};
function planPicks(){
  const seen=new Set(), out=[];
  rows.forEach(r=>{
    if(r.mk!==PLAN.mk) return;
    if(num(r.s)!==PLAN.capital) return;
    const pr0=num(r.pr);
    if(PLAN.verifiedOnly && r.vf!=="A") return;       // a family spending money should see an official price
    if(pr0===0 || pr0==null) return;                 // a free trial cannot fund a family plan
    if(!costPlausible(r)) return;                     // $3.50 for a 100K account is a scrape artefact
    if(/trial|demo/i.test(String(r.p||""))) return;   // nor can a demo/eval-only product
    const key=r.f+"|"+r.p;
    if(seen.has(key)) return;
    seen.add(key);
    out.push(r);
  });
  return out.sort((a,b)=>costOf(a)-costOf(b));
}
function planCopyVerdict(r){
  const e=(DB.eap||{})[r.f]||{};
  const t=String(e.copy||"")+" "+String(r.cc||"");
  if(r.cc===false||/not allowed|prohibited|금지|불가/i.test(t)) return "no";
  if(/personal accounts only|own accounts|same individual|본인/i.test(t)) return "own";

// 첫 지급까지 걸리는 날짜를 '기록된 값'만으로 계산한다: 최소 거래일 + 지급 주기.
// 둘 중 하나라도 없으면 null — 추정해서 지어내지 않는다.
function cycleDays(pc){
  const t=String(pc||"").toLowerCase();
  if(!t) return null;
  if(/on demand|anytime|when requirements|즉시|수시|온디맨드/.test(t)) return 0;
  if(/daily|매일|일일|every 24h|24h/.test(t)) return 1;
  if(/bi-?weekly|2주|격주|every 14/.test(t)) return 14;
  if(/weekly|주간|매주|every 7/.test(t)) return 7;
  if(/monthly|월간|매월|30 days/.test(t)) return 30;
  const m=t.match(/(\d+)\s*(?:business\s*)?(?:day|days|일)/);
  if(m) return Number(m[1]);
  return null;
}

  return {days: md+cy, md, cy};

function costOf(r){
  const to=num(r.to);
  if(to!=null) return to;
  const pr=num(r.pr)||0, ac=num(r.ac)||0;
  return pr+ac;
}
function costPlausible(r){
  const c=costOf(r), sz=num(r.s)||0;
  if(!sz || c===0) return true;          // a free challenge is free, not implausible
  return c >= Math.max(20, sz*0.0005);   // a $100K account cannot cost $3.50
}
const GOAL={size:100000, mk:"cfd", budget:300, speed:"any", rules:new Set()};

function r_priceOf(r){ return r.pr; }
function goalScore(r){
  const T=(ko,en)=>lang==="ko"?ko:en;
  const why=[]; let sc=0;
  const cost=costOf(r);
  if(!costPlausible(r)){
    why.push(T(`가격 확인 필요 ($${cost} 기록)`,`price needs checking ($${cost} recorded)`));
  } else if(cost<=GOAL.budget){ sc+=25; why.push(T(`총액 $${cost} — 예산 이내`,`total $${cost} — within budget`)); }
  else if(cost<=GOAL.budget*1.5){ sc+=12; why.push(T(`총액 $${cost} — 예산 근접`,`total $${cost} — near budget`)); }
  const sz=num(r.s);
  if(sz!=null && GOAL.size){
    const ratio=sz/GOAL.size;
    if(ratio===1){ sc+=20; why.push(T("목표 규모와 정확히 일치","exact target size")); }
    else if(ratio>=0.9&&ratio<=1.1){ sc+=15; why.push(T("목표 규모와 거의 일치","close to target size")); }
    else if(ratio>1.1){ sc+=8; why.push(T("목표보다 큰 계좌","larger than target")); }
  }
  if(r.mk===GOAL.mk) sc+=15; else return -1;
  const t=(r.pc||"").toLowerCase();
  const isOD=/on[- ]?demand|수시|instant/.test(t), isDaily=/daily|매일/.test(t),
        isWeek=/weekly|주간|7일/.test(t), isBi=/bi-?weekly|격주|14/.test(t), isMon=/monthly|월간/.test(t);
  let fast = isOD?15:isDaily?14:isWeek?12:isBi?9:isMon?5:6;
  if(GOAL.speed==="fast") fast += (isOD||isDaily)?4:0;
  if(GOAL.speed==="cycle") fast += (isWeek||isBi)?4:0;
  sc+=fast;
  if(fast>=13) why.push(T("지급이 빠름","fast payouts"));
  const sp=num(r.sp); if(sp!=null){ sc+=Math.min(10,Math.max(0,(sp-70)/3)); if(sp>=90) why.push(T(`분배 ${sp}%`,"split "+sp+"%")); }
  const ml=num(r.ml); if(ml!=null){ sc+=Math.min(10,ml/2); }
  let ruleHit=0;
  GOAL.rules.forEach(k=>{ const v=(k==="ea")?r.ec:(k==="news")?r.nc:(k==="wk")?r.wk:null;
    if(v===true||v==="cond"){ ruleHit++; sc+=5; } });
  if(ruleHit>0) why.push(T(`원하는 규칙 ${ruleHit}개 충족`,`meets ${ruleHit} preferred rule(s)`));
  if(r.vf==="A"){ sc+=15; why.push(T("공식 검증 완료","officially verified")); }
  else if(r.vf==="B") sc+=8;
  if(r.ao==="2026-11-15"||String(r.ao||"")>="2026-11-01") sc+=5;
  return Math.min(100, Math.round(sc));
}

  return out.length?out:[T("기록된 조건 충족","matches recorded conditions")];
}

    <div class="panel"><h3>${ko?"세 가지 원칙":"Three rules"}</h3>
      ${kv(ko?"상품 단위":"Per product", ko?"행 1개 = 브랜드 × 프로그램 × 계좌 규모. 같은 브랜드도 규모와 단계에 따라 규칙이 달라 한 행으로 합치지 않습니다. 현재 <b>"+total.toLocaleString("en-US")+"</b>개 행 · <b>"+nFirms+"</b>개 브랜드.":"One row = brand × programme × account size. Rules differ by size and phase, so rows are never merged. Currently <b>"+total.toLocaleString("en-US")+"</b> rows across <b>"+nFirms+"</b> brands.")}
      ${kv(ko?"기록 시점 고정":"Dated records", ko?"모든 행은 기록일(as-of)을 갖습니다. 등급 A·B는 30일, 미검증 C는 14일이 지나면 표에 ⚠가 붙습니다. 지금 <b>"+stale.toLocaleString("en-US")+"</b>개 행이 기준을 넘었습니다.":"Every row carries an as-of date. Grade A/B expire at 30 days, unverified C at 14; past that the table shows ⚠. <b>"+stale.toLocaleString("en-US")+"</b> rows are past their limit right now.")}
      ${kv(ko?"모르면 비운다":"Empty when unknown", ko?"확인하지 못한 값은 null로 두고 추정하지 않습니다. 화면에서는 — 로 보입니다.":"Unconfirmed values stay null and are never estimated; they render as —.")}
    </div>

    <div class="panel"><h3>${ko?"검증 등급 A/B/C":"Verification grades"}</h3>
      <div class="scroll"><table class="fx"><thead><tr>
        <th scope="col">${ko?"등급":"Grade"}</th><th scope="col">${ko?"뜻":"Meaning"}</th><th scope="col" class="num">${ko?"행":"Rows"}</th><th scope="col" class="num">${ko?"비율":"Share"}</th>
      </tr></thead><tbody>
        ${G.map(([k,d])=>`<tr><td><span class="pill p-${k}">${k}</span></td><td class="dim">${esc(d)}</td>

    <div class="panel"><h3>${ko?"미기록(null) 처리 원칙":"How unknowns are handled"}</h3>

        <li>${ko?"숫자 상한 필터(예: 일일 손실 ≤ 5%)를 걸면 미기록 행은 결과에서 빠집니다. 모른다고 통과시키지 않습니다.":"With a numeric cap filter (e.g. daily loss ≤ 5%) rows without that value drop out. Unknown never passes as a match."}</li>
        <li>${ko?"추정으로 빈칸을 채우지 않습니다. 확인되면 값·출처·기록일을 함께 저장하고 등급을 올립니다.":"Blanks are never filled by estimation. When a value is confirmed, value, source and date are stored together and the grade is raised."}</li>
        <li>${ko?"PFM 참고값(지급 상한·최소 지급액 등)은 ‘PFM 참고(미검증)’로 따로 표기하고 등급을 올리지 않습니다.":"PFM reference values (payout cap, minimum payout…) are labelled ‘PFM reference (unverified)’ and never raise the grade."}</li>
        <li>${ko?"값이 비어 있으면 조사 과제로 남깁니다 — 백로그 9번(결측 보완 조사)이 그 목록입니다.":"A missing value becomes a research task; backlog item 9 is that list."}</li>
      </ul>
      <div class="scroll" style="margin-top:12px"><table class="fx"><thead><tr>
        <th scope="col">${ko?"필드":"Field"}</th><th scope="col" class="num">${ko?"기록":"Recorded"}</th><th scope="col" class="num">${ko?"미기록":"Missing"}</th><th scope="col" class="num">${ko?"미기록 비율":"Missing share"}</th>
      </tr></thead><tbody>
        ${missKeys.map(k=>{const c=cnt(k);return `<tr><td style="font-family:ui-monospace,monospace;font-size:12px">${esc(k)}</td>
          <td class="num mono">${c.toLocaleString("en-US")}</td><td class="num mono">${(total-c).toLocaleString("en-US")}</td>
          <td class="num mono">${pct(total-c)}</td></tr>`;}).join("")}
      </tbody></table></div>
    </div>

    <div class="panel"><h3>${ko?"출처 정책":"Source policy"}</h3>
      <div class="scroll"><table class="fx"><thead><tr>
        <th scope="col">${ko?"출처 유형":"Source type"}</th><th scope="col">${ko?"뜻":"Meaning"}</th><th scope="col" class="num">${ko?"행":"Rows"}</th>
      </tr></thead><tbody>
        ${Object.entries(srcCnt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{
          const s=SRC[k]||[k,k];
          return `<tr><td style="font-family:ui-monospace,monospace;font-size:12px">${esc(k)}</td>
            <td class="dim">${esc(ko?s[0]:s[1])}</td><td class="num mono">${n.toLocaleString("en-US")}</td></tr>`;}).join("")}
      </tbody></table></div>
      <ul style="${UL}">
        <li>${ko?"1차 출처(업체 공식 사이트·구성기·스토어)를 먼저 봅니다. 2차 자료만 있으면 B, 추정이면 C로 내립니다.":"Primary sources (the firm's own site, configurator, store) come first. Secondary-only values are graded B, inferred ones C."}</li>
        <li>${ko?"PFM에서 가져온 값은 화면에 PFM으로 표기하고, 각 페이지 하단에 원문 출처를 남깁니다. 원문은 번역하지 않고 인용합니다.":"PFM-derived values are labelled PFM and attributed at the foot of each page. Source text is quoted, not translated."}</li>
        <li>${ko?"가격은 기록 시점의 정가이며 프로모션이 적용되지 않을 수 있습니다. 프로모션 코드는 별도 필드(po/pt)에 기록합니다.":"Prices are list prices at record time and may exclude promotions; promo codes live in their own fields (po/pt)."}</li>
        <li>${ko?"규칙은 업체가 바꿀 수 있습니다. 기록일 이후 변경이 있으면 이 사이트 값이 틀릴 수 있으므로 자금 투입 전 업체 공식 사이트에서 다시 확인하세요.":"Firms change rules. A value can be stale after its as-of date, so verify on the firm's own site before funding."}</li>
      </ul>
    </div>

    <div class="panel"><h3>${ko?"한 값이 A등급이 되는 절차":"How a value reaches grade A"}</h3>
      <ul style="${UL}">
        <li>${ko?"① 결측·노후 행을 먼저 고릅니다(⚠ 표시가 붙은 행).":"1. Pick the missing or ageing rows first (the ones showing ⚠)."}</li>
        <li>${ko?"② 업체 공식 사이트·구성기에서 값을 직접 읽습니다. 제휴 사이트 수치는 참고만 합니다.":"2. Read the value on the firm's own site or configurator; partner-site numbers are reference only."}</li>
        <li>${ko?"③ 값·출처 문구·기록일을 한 번에 기록합니다. 셋 중 하나라도 없으면 등급을 올리지 않습니다.":"3. Store value, source text and date together. If any one is missing the grade does not rise."}</li>
        <li>${ko?"④ 30일이 지나면 다시 확인 대상이 됩니다(미검증 C는 14일).":"4. After 30 days it becomes due for re-checking (14 for unverified C)."}</li>
      </ul>
    </div>

    <div class="panel"><h3>${ko?"인용 형식":"Citation format"}</h3>
      <div class="empty-inline" style="margin-bottom:8px">${ko?"이 사이트의 값을 인용할 때는 상품 ID·기록일·등급을 함께 적어 주세요. 아래는 실제 데이터에서 만든 예시입니다.":"When citing a value, include the product ID, as-of date and grade. The example below is generated from live data."}</div>
      <div class="note" style="font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap">${esc(exCite)}</div>
    </div>

    <div class="panel"><h3>${ko?"한계":"Limits"}</h3>
      <div class="empty-inline">${ko
        ?"정보 제공용 데이터베이스이며 투자 조언이 아닙니다. 스프레드·랏당 커미션·리뷰 점수 분포는 아직 수집하지 않았습니다. 값이 비어 있는 항목은 ‘없음’이 아니라 ‘미확인’입니다."
        :"An informational database, not investment advice. Spreads, per-lot commissions and review distributions are not collected yet. An empty value means ‘not confirmed’, never ‘none’."}</div>
    </div>

    <div style="margin-top:16px;font-size:12px"><a href="#docs">${ko?"데이터 구조 문서":"Docs"}</a> · <a href="#challenges">${ko?"챌린지 보기":"Challenges"}</a> · <a href="#discover">Discover</a></div>
    ${srcNote(ko?"이 페이지의 수치는 로드된 데이터에서 실시간으로 계산됩니다.":"The figures on this page are computed live from the loaded data.")}`;
}

/* ---------- Prop Firms list ---------- */
function renderFirms(){
  const agg={};
  rows.forEach(r=>{
    const o=agg[r.f]||(agg[r.f]={n:0,mk:new Set(),split:{},grade:{A:0,B:0,C:0},promo:false,min:null,max:null,site:r.ur||null});
    o.n++; if(r.mk) o.mk.add(r.mk);
    if(r.sp!=null) o.split[r.sp]=(o.split[r.sp]||0)+1;
    if(r.vf) o.grade[r.vf]=(o.grade[r.vf]||0)+1;
    if(r.co||r.pt) o.promo=true;
    const s=Number(r.s); if(!isNaN(s)){ o.min=o.min==null?s:Math.min(o.min,s); o.max=o.max==null?s:Math.max(o.max,s); }
  });
  const modeOf2=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null;};
  const list=Object.entries(agg).map(([f,o])=>({f,n:o.n,mk:[...o.mk],sp:modeOf2(o.split),g:o.grade,promo:o.promo,min:o.min,max:o.max,site:o.site}))
    .sort((a,b)=>b.n-a.n);
  el("firmsMain").innerHTML=`
    <div class="hero2"><h1>${lang==="ko"?"프랍펌 · 브로커 목록":"Prop Firms"}</h1>
      <p>${lang==="ko"?`${list.length}개 브랜드. 회사를 누르면 상품·규칙·프로모션가 담긴 상세 페이지로 이동합니다.`:`${list.length} brands. Click a firm for its products, rules and offers.`}</p></div>
    <div class="card"><div class="scroll" style="max-height:calc(100vh - 300px)">
      <table class="fx" style="min-width:820px"><thead><tr>
        <th scope="col">${esc(t("fFirm"))}</th><th scope="col" class="num">${esc(t("rows"))}</th><th scope="col">${esc(t("fAsset"))}</th>
        <th scope="col" class="num">${esc(t("fSplit"))}</th><th scope="col" class="num">${esc(t("fSize"))}</th><th scope="col">${esc(t("grade"))}</th><th scope="col"></th>
      </tr></thead><tbody>${list.map(o=>`<tr>
        <td class="firm"><a href="#firm/${encodeURIComponent(o.f)}" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--line2)">${esc(o.f)}</a>
          ${o.promo?`<span class="tagpromo">PROMO</span>`:""}</td>
        <td class="num">${o.n}</td>
        <td>${o.mk.map(m=>`<span class="tag t-${esc(m)}">${esc(assetLabel(m))}</span>`).join(" ")}</td>
        <td class="num">${o.sp?esc(o.sp)+"%":'<span class="dim">—</span>'}</td>
        <td class="num">${o.min!=null?"$"+Math.min(o.min).toLocaleString('en-US')+"–"+Math.max(o.max).toLocaleString('en-US'):'<span class="dim">—</span>'}</td>
        <td>${(()=>{
        const gs=["A","B","C"].filter(g=>o.g[g]);
        if(!gs.length) return '<span class="dim">—</span>';
        // 한 브랜드에 등급을 두 개 이상 보여주면 "등급이 왜 둘이지"가 된다. 대표 등급 하나만 표시하고
        // 나머지는 툴팁에 남긴다 (행 수가 많은 쪽, 동률이면 더 높은 등급).
        const best=gs.slice().sort((a,b)=>(o.g[b]-o.g[a])||("ABC".indexOf(a)-"ABC".indexOf(b)))[0];
        const tip=gs.map(g=>`${g} ${o.g[g]}${lang==="ko"?"행":" rows"}`).join(" · ");
        const rest=gs.filter(g=>g!==best).reduce((a,g)=>a+o.g[g],0);
        return `<span title="${esc(tip)}"><span class="pill p-${best}">${best}</span>`+
          (rest?`<span class="dim" style="font-size:10px;margin-left:4px">+${rest}</span>`:"")+`</span>`;
      })()}</td>
        <td>${o.site?`<a href="${esc(o.site)}" target="_blank" rel="noopener" style="font-size:12px">site ↗</a>`:""}</td>
      </tr>`).join("")}</tbody></table></div></div>
    ${faqBlock([[lang==="ko"?"브랜드 수가 자주 바뀌나요?":"Do brands change often?",
      lang==="ko"?"새 브랜드가 추가되면 자동으로 이 목록에 나타납니다.":"New brands appear here automatically once records exist."]])}
    ${srcNote(lang==="ko"?"브랜드·상품 수는 HELIX 기록 기준입니다.":"Brand and product counts come from HELIX records.")}`;
}

/* ---------- Offers ---------- */
function renderOffers(){

  rows.forEach(r=>{
    if(!r.co&&!r.pt&&!r.px) return;
    const o=byFirm[r.f]||(byFirm[r.f]={code:null,text:null,exp:null});
    if(!o.code&&r.co) o.code=r.co;
    if(!o.text&&(r.pt||r.po)) o.text=r.pt||r.po;
    if(!o.exp&&r.px) o.exp=r.px;
  });
  const listAll=Object.entries(byFirm).sort((a,b)=>a[0].localeCompare(b[0]));
  const list=listAll.filter(([,o])=>
    offersFilter==="official"? !!o.code :
    offersFilter==="expiry"? !!o.exp : true);
  el("offersMain").innerHTML=`
    <div class="hero2"><h1>${lang==="ko"?"업체가 공개한 프로모션만":"Only offers the firms publish"}</h1>
      <p>${lang==="ko"?`${list.length}개 브랜드. 업체 공식 페이지에서 직접 확인한 코드만 싣습니다. 다른 비교 사이트의 파트너 코드는 재배포하지 않습니다.`:`${list.length} brands. Only codes read from the firm's own page. We do not republish other sites' partner codes.`}</p></div>
    <div class="stats">
      <a class="stat statlink ${offersFilter==="all"?"on":""}" data-of="all"><div class="n">${listAll.length}</div>
        <div class="l">${lang==="ko"?"프로모션 브랜드":"promo brands"} <span class="go">→</span></div></a>
      <a class="stat statlink ${offersFilter==="official"?"on":""}" data-of="official"><div class="n">${listAll.filter(([,o])=>o.code).length}</div>
        <div class="l">${lang==="ko"?"공식 코드 기록":"official codes"} <span class="go">→</span></div></a>
      <a class="stat statlink ${offersFilter==="expiry"?"on":""}" data-of="expiry"><div class="n">${listAll.filter(([,o])=>o.exp).length}</div>
        <div class="l">${lang==="ko"?"만료일 기록":"with expiry"} <span class="go">→</span></div></a>
    </div>
    <div class="card"><div class="scroll" style="max-height:calc(100vh - 340px)">
      <table class="fx" style="min-width:760px"><thead><tr>
        <th scope="col">${lang==="ko"?"브랜드":"Brand"}</th><th scope="col">${lang==="ko"?"공식 코드":"Official code"}</th>
        <th scope="col">${lang==="ko"?"할인 내용":"Discount"}</th><th scope="col">${lang==="ko"?"만료":"Expiry"}</th><th scope="col"></th>
      </tr></thead><tbody>${list.map(([f,o])=>`<tr>
        <td class="firm"><a href="#firm/${encodeURIComponent(f)}" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--line2)">${esc(f)}</a></td>
        <td>${o.code?`<span class="code" style="font-size:12px;padding:3px 8px">${esc(o.code)}</span>`:'<span class="dim">—</span>'}</td>
        <td style="white-space:normal;max-width:320px">${o.text?esc(o.text):'<span class="dim">—</span>'}</td>
        <td>${o.exp?expiryChip(o.exp):'<span class="dim">—</span>'}</td>
        <td><a href="#challenges" onclick="window.__firmFilter='${esc(f)}'" style="font-size:12px">${lang==="ko"?"상품 보기":"Products"}</a></td>

/* PFM 커미션 원문은 '자산군\n값' 형태의 긴 텍스트다. 그대로 쏟아내지 않고 6개 열로 나눈다.
   'Additional Information' 이하 설명문은 표에서 제외한다. 값이 없으면 — (추정 금지). */
const COMM_ASSETS=[["FX","FX"],["Metals","금속"],["Indices","지수"],["Energy","에너지"],["Crypto","크립토"],["Other Commodities","기타 원자재"]];
function parseComm(txt){
  const out={};
  const lines=String(txt||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let cur=null;
  for(const ln of lines){
    if(/^additional information$/i.test(ln)) break;
    const hit=COMM_ASSETS.find(([en])=>ln.toLowerCase()===en.toLowerCase());
    if(hit){ cur=hit[0]; if(!(cur in out)) out[cur]=""; continue; }
    if(cur && !out[cur]) out[cur]=ln;
  }
  return out;
}

function ruleState(vals){
  const y=vals.filter(v=>v==="y").length, n=vals.filter(v=>v==="n").length,
        c=vals.filter(v=>v==="c").length, u=vals.filter(v=>v==="u").length;
  if(!y&&!n&&!c) return {k:"unk",lbl:t("stUnk")};
  if(!n&&!c&&y) return {k:"yes",lbl:t("stYes")};
  if(!y&&!n&&c) return {k:"mix",lbl:t("stCond")};
  if(!y&&!c&&n) return {k:"no",lbl:t("stNo")};
  return {k:"mix",lbl:t("stMix")};
}
const flagOf=v=> v===true?"y":(v===false?"n":(v==="cond"?"c":"u"));

const PLAT_NORM=[["mt4","mt4"],["metatrader 4","mt4"],["metatrader4","mt4"],
  ["mt5","mt5"],["metatrader 5","mt5"],["metatrader5","mt5"],
  ["ctrader","ctrader"],["tradingview","tradingview"],["matchtrader","matchtrader"],
  ["tradelocker","tradelocker"],["dxtrade","dxtrade"],["proreal","proreal"],
  ["xstation","xstation"],["saxtrader","saxtrader"],["saxoinvestor","saxtrader"],
  ["proptrader","saxtrader"],["tradovate","tradovate"],["thinktrader","thinktrader"]];
function platKey(name){
  const t=String(name||"").toLowerCase();
  for(const [needle,key] of PLAT_NORM){ if(t.includes(needle)) return key; }
  return null;
}
function challengePlatforms(r){
  const e=(DB.eap||{})[r.f];

function brokersForPlatforms(plats){
  const mine=new Set(plats.map(platKey).filter(Boolean));
  if(!mine.size) return [];
  return ((DB.brokers||{}).brokers||[]).filter(b=>b.status==="verified" &&
    (b.plat||[]).map(platKey).some(k=>k && mine.has(k)));
}

  const map={
    no:{cls:"no", ko:"이 상품은 카피트레이딩이 금지됩니다. 가족·그룹이 각자 계좌를 사서 같은 전략을 돌리면 규칙 위반입니다.", en:"Copy trading is prohibited on this product — family or group members running the same strategy on separate accounts risk a rule breach."},

    unknown:{cls:"unk", ko:"카피트레이딩 규칙이 기록되지 않았습니다. 브랜드의 규칙 페이지에서 확인하세요.", en:"Copy-trading rules are not recorded for this brand — check the firm's rules page."}
  };
  const m=map[level];

const PAGES={sitemap:"pageSitemap",plan:"pagePlan",brokers:"pageBrokers",goal:"pageGoal",home:"pageHome",offers:"pageOffers",firms:"pageFirms",docs:"pageDocs",method:"pageMethod",discover:"pageDiscover",challenge:"pageChallenge",challenges:"pageChallenges",compare:"pageCompare",

function route(){
  let h=(location.hash||"").replace(/^#/,"")||"home";
  const _q=h.indexOf("?");
  if(_q>=0){ const _p=new URLSearchParams(h.slice(_q+1));
    if(h.slice(0,_q)==="challenges") applyURLState(_p, true);
    const _f=_p.get("fee"); if(_f) feeFilter=_f;
    h=h.slice(0,_q); }
  urlReady=true;
  if(h.startsWith("compare/")){ const ids=h.slice(8).split(",").filter(Boolean);
    if(ids.length){ picked.clear(); ids.forEach(x=>picked.add(decodeURIComponent(x))); } h="compare"; }
  const isFirm=h.startsWith("firm/");
  const isCh=h.startsWith("challenge/");
  const page=isFirm?"challenges":(isCh?"challenge":(PAGES[h]?h:"challenges"));
  Object.entries(PAGES).forEach(([k,id])=>{ el(id).style.display=(k===page)?"grid":"none"; });
  el("pageFirm").style.display=isFirm?"grid":"none";
  /* a firm page reuses the "challenges" key to keep the nav highlight, but the
     challenges table itself must not stay stacked above the brand page */
  if(isFirm) el("pageChallenges").style.display="none";
  if(isCh){ const cid=decodeURIComponent(h.slice(10)); const cr=rows.find(x=>x.i===cid); setTitle(cr?cr.f:""); }
  document.querySelectorAll("#subnav a").forEach(a=>{
    const also=(a.dataset.also||"").split(",").filter(Boolean);
    a.classList.toggle("on",a.dataset.page===page||also.includes(page));
  });
  const TITLES={home:"",challenges:"Challenges",compare:"Compare Challenges",offers:"Offers",firms:"Prop Firms",docs:"Docs",method:"Method & Fields",goal:"Goal finder",brokers:"Brokers",plan:"Family plan",
    rules:"Prop Firm Rules",spreads:"Spreads",payouts:"Payouts",tools:"Trading Tools"};
  if(isFirm){ const nm=decodeURIComponent(h.slice(5)); setTitle(nm); }
  else if(!isCh) setTitle(TITLES[page]!==undefined?TITLES[page]:"Challenges");
  if(isFirm) renderFirm(decodeURIComponent(h.slice(5)));
  else if(page==="home"){ renderHome(); bindHomeLinks(); }
  else if(page==="offers") renderOffers();
  else if(page==="firms") renderFirms();
  else if(page==="docs") renderDocs();
  else if(page==="method") renderMethod();
  else if(page==="sitemap") renderSitemap();
  else if(page==="plan") renderPlan();
  else if(page==="brokers") renderBrokers();
  else if(page==="goal") renderGoal();
  else if(page==="discover") renderDiscover();
  else if(page==="challenge") renderChallenge(decodeURIComponent(h.slice(10)));
  else if(page==="challenges"){ if(_q>=0) render(); }
  else if(page==="compare") renderCompare();
  else if(page==="payouts") renderPayouts();
  else if(page==="spreads") renderSpreads();
  else if(page==="tools") renderTools();
  else if(page==="rules") renderRules();
  window.scrollTo({top:0,behavior:"instant"});
}
