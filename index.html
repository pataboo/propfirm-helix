<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELIX — Prop Firm Compare</title>
<style>
:root{
  --bg:#ffffff; --fg:#14161a; --mut:#6b7280; --line:#e5e7eb; --card:#f8fafc;
  --acc:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115; --fg:#e6e8ec; --mut:#9aa3ad; --line:#262b33; --card:#161a20;
        --acc:#5b8cff; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1b2333;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:-.01em}
h1 b{color:var(--acc)}
.sub{color:var(--mut);font-size:11.5px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.spacer{flex:1}
td.actc{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th[data-k="act"]{max-width:86px}
#tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#fpanel{display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#fpanel.on{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
#fpanel label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
#fpanel .ck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--fg)}
#fpanel input[type=number],#fpanel select{width:100%}
#fcount{background:var(--acc);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:4px}
#tools input[type=search]{min-width:200px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.presets button{font-size:12px}
main{padding:0 14px 120px}
.wrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px;margin-top:10px}
tr.krno td.firm,tr.krno td.plan{color:#dc2626 !important;text-decoration:line-through}
tr.krno{opacity:.72} tr.dead td.firm,tr.dead td.plan{color:#dc2626 !important;text-decoration:line-through} tr.dead{opacity:.62} .mt5ok{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;background:rgba(22,163,74,.12);color:#16a34a;font-weight:800;font-size:11px;text-align:center} .mt5no{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;background:rgba(220,38,38,.10);color:#dc2626;font-weight:800;font-size:11px;text-align:center} .b-cond{background:rgba(217,119,6,.12)!important;color:#d97706!important;font-weight:800}
.mt5un{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;border:1px dashed #c2c6cc;color:#98a2b3;font-size:10px;text-align:center} tr.planned td.firm,tr.planned td.plan{color:#d97706 !important;text-decoration:line-through} tr.planned{opacity:.72} .krTag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid #dc2626;border-radius:5px;font-size:10px;font-weight:800;color:#fff;background:#dc2626;vertical-align:middle}
.planTag{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #d97706;border-radius:5px;font-size:10px;font-weight:800;color:#d97706;vertical-align:middle} .deadTag{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #dc2626;border-radius:5px;font-size:10px;font-weight:800;color:#dc2626;vertical-align:middle}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);text-align:center;padding:8px 8px;font-weight:600;white-space:nowrap;cursor:pointer;z-index:2}
thead th:hover{color:var(--acc)}
thead th[data-dir="asc"]::after{content:" ▲";color:var(--acc);font-size:9px}
thead th[data-dir="desc"]::after{content:" ▼";color:var(--acc);font-size:9px}
tbody td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--card)}
tbody tr.sel{background:var(--chip)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.firm{font-weight:600}
.plan{color:var(--mut);font-size:11.5px}
.b{display:inline-block;min-width:18px;text-align:center;border-radius:5px;padding:1px 4px;font-size:10.5px;font-weight:700;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}
.b-no{color:var(--bad);border-color:var(--bad)}
.b-un{color:var(--mut);border-color:var(--line)}
.pill{display:inline-block;background:var(--chip);color:var(--acc);border-radius:20px;padding:1px 7px;font-size:10.5px}
.strike{text-decoration:line-through;color:var(--mut);font-size:11px;margin-right:4px}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .18s ease;z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#drawer.open{transform:none}
#dhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
#dbody{overflow:auto;padding:12px 14px 40px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:6px 0 12px}
.kv dt{color:var(--mut);font-size:11.5px}
.kv dd{margin:0;font-size:12.5px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11.5px;white-space:pre-wrap;line-height:1.45}
a{color:var(--acc);text-decoration:none}
/* compare tray */
#tray{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px;display:none;z-index:40}
#tray.on{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tray .tag{background:var(--chip);border-radius:6px;padding:3px 7px;font-size:11.5px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;padding:4vh 3vw;overflow:auto}
#modal.on{display:block}
#modal .box{background:var(--bg);border-radius:12px;padding:14px;max-width:1100px;margin:0 auto}
#modal table{font-size:12px}
.empty{color:var(--mut);padding:24px;text-align:center}
.tag2{font-size:10.5px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><b>HELIX</b> <span class="sub" id="tagline">Prop Firm 비교 — 규정 × 가격</span></h1>
    <div class="spacer"></div>
    <button id="langBtn">EN</button>
    <button id="ccyBtn">USD</button>
    <button id="ddBtn">DD %</button>
    <span class="sub" id="cnt"></span>
    <span class="tag2" title="100K 플랜 비율을 동일 플랜 타 사이즈에 적용">* = 100K 비율 상속</span>
    <span class="tag2" title="DD 87% · 첫 지급 78% · 일관성 47% · 총액 99.6% — 각 값의 출처는 행 클릭 시 원문 메모 참조">기준 2026-11-15</span>
    
  </div>
  <div id="tools">
    <input type="search" id="q" placeholder="업체 · 플랜 · 사이즈">
    <select id="mkt"><option value="">Market: all</option><option value="cfd">CFD</option><option value="fut">선물</option><option value="syn">합성</option></select>
    <label class="ck" id="mt5Wrap" style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:32px"><input type="checkbox" id="mt5Top"><span>MT5</span></label>
    <select id="size"><option value="">Size: all</option></select>
    <select id="type"><option value="">Type: all</option></select>
    <button id="reset">Reset</button>
    <button id="fbtn">Filters<span id="fcount" style="display:none"></span></button>
    <div id="fpanel">
    <div><label data-l="steps">단계</label><select id="f_steps"><option value="">전체</option><option value="instant">Instant</option><option value="1">1-Step</option><option value="2">2-Step</option><option value="3">3-Step</option></select></div>
    <div><label data-l="dd">DD 방식</label><select id="f_dd"><option value="">전체</option></select></div>
    <div><label data-l="payCycle">지급 주기</label><select id="f_payC"><option value="">전체</option></select></div>
    <div><label data-l="payFirst">첫 지급</label><select id="f_payF"><option value="">전체</option></select></div>
    <div><label data-l="split">분배 최소 %</label><input id="f_split" type="number" min="0" max="100" step="5" placeholder="예: 80"></div>
    <div><label data-l="rating">평점 최소 ★</label><input id="f_rating" type="number" min="0" max="5" step="0.1" placeholder="예: 4.0"></div>
    <div><label data-l="price">총액 최대 $</label><input id="f_price" type="number" min="0" step="50" placeholder="예: 400"></div>
    <div><label data-l="disc">할인 최소 %</label><input id="f_disc" type="number" min="0" max="100" step="10" placeholder="예: 30"></div>
    <div><label data-l="days">최소일수 상한</label><input id="f_days" type="number" min="0" step="1" placeholder="예: 14"></div>
    <div class="ck"><input type="checkbox" id="f_mt5"><span data-l="mt5">MT5</span></div>
    <div class="ck"><input type="checkbox" id="f_news"><span data-l="news">뉴스 허용</span></div>
    <div class="ck"><input type="checkbox" id="f_ovn"><span data-l="ovn">오버나이트</span></div>
    <div class="ck"><input type="checkbox" id="f_wk"><span data-l="wkd">주말 보유</span></div>
    <div style="grid-column:1/-1;font-size:11px;color:var(--mut)" id="fhint"></div>
    <div class="ck"><input type="checkbox" id="f_ea"><span>EA 허용</span></div>
    <div class="ck"><input type="checkbox" id="f_cp"><span>카피 허용</span></div>
  </div>
  <div class="presets" id="presets"></div>
</header>
<main>
  <div class="wrap"><table id="tbl">
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</main>
<div id="drawer"><div id="dhead"></div><div id="dbody"></div></div>
<div id="tray"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

  if(f.priceMax!=null && isFinite(f.priceMax)) r = r.filter(x => x.total!==null && x.total!==undefined && x.total<=f.priceMax);
  if(f.discMin!=null && isFinite(f.discMin)) r = r.filter(x => discOf(x)>=f.discMin);
  if(f.daysMax!=null && isFinite(f.daysMax)) r = r.filter(x => x.minDaysFinal!==null && x.minDaysFinal!==undefined && x.minDaysFinal<=f.daysMax);
  if(f.news) r = r.filter(x => x.newsC===true);
  if(f.ovn) r = r.filter(x => x.onC===true);
  if(f.wk) r = r.filter(x => x.wk==="yes"||x.wk===true);
  if(f.ea) r = r.filter(x => x.eaC===true && x.eaF===true);
  if(f.cp) r = r.filter(x => x.cpC===true && x.cpF===true);
  if(f.preset==="tot") r = r.filter(x => x.total!==null);
  if(f.preset==="buy") r = r.filter(x => x.korea!=="no" && x.eaC===true && x.eaF===true && x.cpC===true && x.cpF===true && (x.disc||0)>=30);
  if(f.preset==="best"){ r = r.filter(x=>x.val).sort((a,b)=>b.val-a.val); return r; }   if(f.preset==="src"){ r = r.filter(x=>x.verified && x.verified!=="C"); return r; }
   if(f.preset==="gap"){ r = r.filter(x=>!x.total||x.daily==null||x.maxloss==null||!x.consist||!x.payFirst||!x.rating); return r; }
   if(f.preset==="paf"){ r = r.filter(x=>/pay later|flash activation|pay after pass/i.test(x.plan||"")||((x.price||0)>0&&(x.price||0)<=5)); return r; }
  if(f.preset==="sale") r = r.filter(x => (x.disc||0)>=40);
  if(f.preset==="cheap"){ r = r.filter(x=>x.total!==null).sort((a,b)=>a.total-b.total); return r; }
  const k = sortKey, d = sortDir;
  r.sort((a,b)=>{
    let x=a[k], y=b[k];
    if(k==="size"||k==="price"||k==="total"||k==="act"||k==="daily"||k==="maxloss"){ x=numOf(x); y=numOf(y); }
    if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
    if(typeof x==="number" && typeof y==="number") return (x-y)*d;
    return String(x).localeCompare(String(y))*d;
  });
  return r;
}

      else if(k==="korea") v = x.korea==="no"?T().no:"?";
      else if(k==="price"||k==="act"||k==="total") v = money(k==="act"?numOf(x.act):x[k]);
      else if(k==="daily") v = (x.daily?money(x.daily):U())+" / "+(x.maxloss?money(x.maxloss):U());
      else v = x[k]??U();
      return `<td>${v}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("#modal").classList.add("on");
}

// ---------- init ----------
function fillSelects(){
  const sizes=[...new Set(DATA.rows.map(r=>r.size).filter(Boolean))].sort((a,b)=>a-b);
  $("#size").innerHTML = `<option value="">${T().sizeAll}</option>`+sizes.map(s=>`<option value="${s}">${s.toLocaleString()}</option>`).join("");
  const types=[...new Set(DATA.rows.map(r=>r.type).filter(Boolean))].sort();
  $("#type").innerHTML = `<option value="">${T().typeAll}</option>`+types.map(s=>`<option value="${s}">${s}</option>`).join("");
}
function fillPresets(){
  const p=T().presets;
  $("#presets").innerHTML = Object.entries(p).map(([k,v])=>`<button data-p="${k}" class="${f.preset===k?"on":""}">${v}</button>`).join("")
    + `<button data-p="rate">${T().rate} ${rate}</button>`;
  $("#presets").querySelectorAll("[data-p]").forEach(b=>{
    b.onclick = ()=>{
      const p=b.dataset.p;
      if(p==="rate"){ const v=prompt(T().rate, rate); if(v){ rate=Number(v)||rate; localStorage.setItem("helix_rate",rate); render(); } return; }
      f.preset = (f.preset===p)?"":p; fillPresets(); render();
    };
  });
}
function fillFilterOpts(){
  const dds=[...new Set(DATA.rows.map(r=>r.dd).filter(Boolean))].sort();
  const pays=[...new Set(DATA.rows.map(r=>r.payCycle).filter(Boolean))].sort();
  const firsts=[...new Set(DATA.rows.map(r=>r.payFirst).filter(Boolean))].sort();
  const keep=(sel,arr,all)=>{const v=sel.value; sel.innerHTML=`<option value="">${all}</option>`+arr.map(x=>`<option value="${x}">${x}</option>`).join(""); sel.value=v;};
  keep($("#f_dd"),dds,lang==="ko"?"전체":"All");
  keep($("#f_payC"),pays,lang==="ko"?"전체":"All");
  keep($("#f_payF"),firsts,lang==="ko"?"전체":"All");
  const st=$("#f_steps"); if(st&&st.options&&st.options[0]) st.options[0].textContent = lang==="ko"?"전체":"All";
}
function fActive(){
  let n=0;
  if(f.stages)n++; if(f.dd)n++; if(f.payCycle)n++; if(f.payFirst)n++; if(f.splitMin!=null && isFinite(f.splitMin))n++;
  if(f.ratingMin!=null && isFinite(f.ratingMin))n++; if(f.priceMax!=null && isFinite(f.priceMax))n++; if(f.discMin!=null && isFinite(f.discMin))n++; if(f.daysMax!=null && isFinite(f.daysMax))n++;
  ["news","ovn","wk","ea","cp"].forEach(k=>{if(f[k])n++;});
  return n;
}
function updateFcount(){
  const n=fActive(), b=$("#fcount");
  if(!b) return;
  b.textContent=n; b.style.display=n?"inline":"none";
  $("#fbtn").classList.toggle("on", n>0);
}
function bindFilters(){
  const num=(id,key,vmax)=>$(id).oninput=e=>{const v=e.target.value.trim(); f[key]= v===""?null:Math.max(0,Math.min(vmax,Number(v))); render(); updateFcount();};
  num("#f_split","splitMin",100); num("#f_rating","ratingMin",5); num("#f_price","priceMax",1e9); num("#f_disc","discMin",100); num("#f_days","daysMax",365);
  $("#f_steps").onchange=e=>{f.stages=e.target.value; render(); updateFcount();};
  $("#f_dd").onchange=e=>{f.dd=e.target.value; render(); updateFcount();};
  $("#f_payC").onchange=e=>{f.payCycle=e.target.value; render(); updateFcount();};
  $("#f_payF").onchange=e=>{f.payFirst=e.target.value; render(); updateFcount();};
  [["#f_news","news"],["#f_ovn","ovn"],["#f_wk","wk"],["#f_ea","ea"],["#f_cp","cp"]].forEach(([id,k])=>{
    $(id).onchange=e=>{f[k]=e.target.checked; render(); updateFcount();};
  });
  $("#fbtn").onclick=()=>$("#fpanel").classList.toggle("on");
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T()[e.dataset.i]);
  $("#q").placeholder = T().search;
  (()=>{const m=$("#mkt"); if(!m) return; m.options[0].text = lang==="ko"?"시장: 전체":"Market: all"; m.options[1].text="CFD"; m.options[2].text=lang==="ko"?"선물":"Futures"; m.options[3].text=lang==="ko"?"합성":"Synthetic";})();
  $("#langBtn").textContent = lang==="ko"?"EN":"한국어";
  $("#ccyBtn").textContent = ccy;
  $("#ddBtn").textContent = ddUnit==="pct"?"DD %":"DD $";
  fillSelects(); fillPresets(); fillFilterOpts(); head(); render(); refreshStatic(); updateFcount();
  document.querySelectorAll("[data-l]").forEach(e=>{const k="f_"+e.dataset.l; if(T()[k]) e.textContent=T()[k];});
  $("#fbtn").firstChild.textContent = T().filters;
  const hint=$("#fhint");
  if(hint) hint.textContent = lang==="ko"
    ? "총액 최대 $ = 이 금액 이하인 상품만 · 실구매 후보 = 한국가능 + EA(평가·펀딩) + 카피(평가·펀딩) + 할인 30%↑ · DD방식·지급주기는 데이터에 존재하는 값만 표시"
    : "Max total $ = only products at or below this cost · Buy shortlist = Korea ok + EA (eval+funded) + copy (eval+funded) + 30%+ off · DD type and payout list only values present in data";
}
function refreshStatic(){
  $("#reset").textContent = T().reset;
}
$("#langBtn").onclick = ()=>{ lang = lang==="ko"?"en":"ko"; localStorage.setItem("helix_lang",lang); applyLang(); };
$("#ddBtn").onclick = ()=>{ ddUnit = ddUnit==="pct"?"usd":"pct"; localStorage.setItem("helix_dd",ddUnit); applyLang(); };
$("#ccyBtn").onclick = ()=>{ ccy = ccy==="USD"?"KRW":"USD"; localStorage.setItem("helix_ccy",ccy); applyLang(); };
$("#q").oninput = e=>{ f.q=e.target.value; render(); };
$("#mkt").onchange = e=>{ f.mkt=e.target.value; render(); };
$("#mt5Top").onchange = e=>{ f.mt5=e.target.checked; const b=$("#f_mt5"); if(b) b.checked=f.mt5; render(); };
$("#f_mt5").onchange = e=>{ f.mt5=e.target.checked; const b=$("#mt5Top"); if(b) b.checked=f.mt5; render(); };
$("#size").onchange = e=>{ f.size=e.target.value; render(); };
$("#type").onchange = e=>{ f.type=e.target.value; render(); };
$("#reset").onclick = ()=>{
  f={q:"",size:"",type:"",mkt:"",mt5:false,preset:"",stages:"",dd:"",payout:"",splitMin:null,ratingMin:null,priceMax:null,discMin:null,daysMax:null,news:false,ovn:false,wk:false,ea:false,cp:false};
  ["#q","#mkt","#size","#type","#f_steps","#f_dd","#f_payC","#f_payF","#f_split","#f_rating","#f_price","#f_disc","#f_days"].forEach(s=>{const e=$(s); if(e) e.value="";});
  ["#f_news","#f_ovn","#f_wk","#f_ea","#f_cp","#f_mt5","#mt5Top"].forEach(s=>{const e=$(s); if(e) e.checked=false;});
  fillPresets(); render(); updateFcount();
};
$("#modal").onclick = e=>{ if(e.target.id==="modal") $("#modal").classList.remove("on"); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("#modal").classList.remove("on"); $("#drawer").classList.remove("open"); }});
bindFilters();
applyLang();

/* ---- deep links: #id=<rowId> ---- */
const _openDrawer = openDrawer;
openDrawer = function(id){
  _openDrawer(id);
  try { history.replaceState(null, "", "#id=" + encodeURIComponent(id)); } catch(e){}
};
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
}
function copyLink(id){
  const u = location.origin + location.pathname + "#id=" + encodeURIComponent(id);
  const done = () => { try{ navigator.clipboard.writeText(u); }catch(e){} };
  done();
  const b = event && event.target; if(b){ const o=b.textContent; b.textContent="✅"; setTimeout(()=>b.textContent=o,1200); }
}
function openFromHash(){
  const m = /^#id=(.+)$/.exec(location.hash || "");
  if(!m) return;
  const id = decodeURIComponent(m[1]);
  if(!DATA.rows.some(r=>r.id===id)) return;
  f.q=""; f.preset=""; const q=document.getElementById('q'); if(q) q.value="";
  fillPresets(); render(); openDrawer(id);
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
