<!DOCTYPE html>
<html lang="ko" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SilentFam Helix — 프랍펌 및 브로커 데이터베이스</title>
<meta name="description" content="SilentFam Helix — 프랍펌 및 브로커 데이터베이스. 참가비·낙폭·지급조건·근거 링크까지 상품별로 추적합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html[data-theme="dark"]{
    --bg:#0b0e13;--panel:#11161f;--panel2:#151b26;--line:#222a38;--line2:#303a4d;
    --ink:#eef2f8;--ink2:#c2cddd;--muted:#93a0b4;
    --pink:#e74694;--cyan:#00e5ff;--purple:#9d7bfb;--blue:#5b95ff;
    --green:#3ddc97;--amber:#ffc247;--red:#ff6b5e;--shadow:0 18px 50px rgba(0,0,0,.55);
  }
  html[data-theme="light"]{
    --bg:#fff;--panel:#fff;--panel2:#f8fafc;--line:#e5e7eb;--line2:#d1d5db;
    --ink:#111827;--ink2:#374151;--muted:#6b7280;
    --pink:#d6357f;--cyan:#0089a3;--purple:#6d3ff0;--blue:#2265f2;
    --green:#0a9d68;--amber:#a67400;--red:#c8392c;--shadow:0 18px 40px rgba(17,24,39,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  a{color:var(--blue)}
  .top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .top .in{max-width:1500px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px;height:64px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pink),var(--purple));
    display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
  .brand b{font-size:17px;letter-spacing:-.02em;font-weight:800}
  .brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .grow{flex:1}
  .meta{display:flex;gap:18px;font-size:12px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:700}
  .iconbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;
    width:36px;height:36px;cursor:pointer;font-size:15px;display:grid;place-items:center}
  .iconbtn:hover{color:var(--ink);border-color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer}
  .lang button.on{background:var(--ink);color:var(--bg)}
  .shell{max-width:1500px;margin:0 auto;padding:22px;display:grid;grid-template-columns:262px 1fr;gap:22px;align-items:start}
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:86px}
  .filters h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .fg{margin-bottom:16px}
  .fg > label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:7px}
  .opts{display:flex;flex-wrap:wrap;gap:6px;max-height:152px;overflow:auto}
  .opt{font-size:12px;padding:5px 10px;border-radius:9999px;border:1px solid var(--line2);color:var(--ink2);
    background:transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
  .opt:hover{border-color:var(--muted);color:var(--ink)}
  .opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
  .range{display:flex;gap:8px;align-items:center}
  .range input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);
    font:inherit;font-size:12.5px;padding:7px 9px}
  .range span{color:var(--muted);font-size:12px}
  .reset{width:100%;margin-top:4px;background:transparent;border:1px solid var(--line2);color:var(--ink2);
    border-radius:9px;padding:9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:19px;font-weight:800}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:3px}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em;font-weight:800}
  .hero p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6;max-width:720px}
  .searchrow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line2);
    border-radius:10px;padding:10px 14px}
  .search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;width:100%}
  .search input::placeholder{color:var(--muted)}
  .count{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .scroll{overflow:auto;max-height:calc(100vh - 320px)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1020px}
  thead th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);
    white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
  thead th:hover{color:var(--ink)}
  th.num,td.num{text-align:right}
  th .ar{color:var(--pink);font-size:8px;margin-left:3px}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.open{background:var(--panel2);box-shadow:inset 3px 0 0 var(--pink)}
  .firm{font-weight:700}
  .plan{color:var(--ink2);max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .mono{font-variant-numeric:tabular-nums}
  .dim{color:var(--muted)}
  .pill{display:inline-block;border-radius:9999px;padding:2px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .p-A{background:rgba(61,220,151,.16);color:var(--green)}
  .p-B{background:rgba(255,194,71,.16);color:var(--amber)}
  .p-C{background:rgba(147,160,180,.18);color:var(--muted)}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.03em}
  .t-cfd{background:rgba(91,149,255,.15);color:var(--blue)}
  .t-fut,.t-futures{background:rgba(157,123,251,.16);color:var(--purple)}
  .t-crypto{background:rgba(0,229,255,.14);color:var(--cyan)}
  .t-stocks{background:rgba(231,70,148,.15);color:var(--pink)}
  .t-syn{background:rgba(255,194,71,.14);color:var(--amber)}
  .yes{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
  .empty{padding:44px;text-align:center;color:var(--muted)}
  /* hover popover */
  .pop{position:fixed;z-index:70;width:296px;background:var(--panel);border:1px solid var(--line2);
    border-radius:13px;box-shadow:var(--shadow);padding:13px;opacity:0;pointer-events:none;transition:opacity .12s}
  .pop.on{opacity:1;pointer-events:auto}
  .pop .ph{font-weight:800;font-size:13.5px;letter-spacing:-.01em}
  .pop .ps{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pop .pg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}
  .pop .pk{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .pop .pk .v{font-weight:800;font-size:13px}
  .pop .pk .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:2px}
  .pop .pb{display:flex;gap:7px}
  .pop button{flex:1;border-radius:9px;padding:8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line2);
    background:transparent;color:var(--ink2)}
  .pop button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
  .pop button:hover{color:var(--ink)}
  .pop button.primary:hover{color:#fff;filter:brightness(1.06)}
  /* compare bar + modal */
  .cbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line2);
    transform:translateY(120%);transition:transform .22s;z-index:48;padding:11px 0}
  .cbar.on{transform:none}
  .cbar .in{max-width:1500px;margin:0 auto;padding:0 22px;display:flex;gap:10px;align-items:center}
  .cchip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);
    border-radius:9999px;padding:6px 12px;font-size:12px;white-space:nowrap}
  .cchip b{font-weight:700}
  .cchip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:0 0 0 2px}
  .btn{background:var(--pink);border:0;color:#fff;border-radius:9px;padding:9px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .btn:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed}
  .btn.g{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  /* drawer */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(580px,100vw);background:var(--bg);
    border-left:1px solid var(--line2);box-shadow:var(--shadow);transform:translateX(102%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .dhead .t{flex:1;min-width:0}
  .dhead h2{margin:0;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dhead .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .dbody{overflow:auto;padding:18px 20px 60px;flex:1}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .v{font-size:20px;font-weight:800;line-height:1.15}
  .kpi .v.g{color:var(--green)}.kpi .v.r{color:var(--red)}.kpi .v.a{color:var(--amber)}.kpi .v.c{color:var(--cyan)}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
  .sect{margin:20px 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;
    display:flex;align-items:center;gap:8px}
  .sect::after{content:"";flex:1;height:1px;background:var(--line)}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:10px;overflow:hidden}
  .kv > div{background:var(--panel);padding:9px 12px;font-size:12.5px}
  .kv .k{color:var(--ink2);font-weight:600}
  .rules{display:flex;flex-wrap:wrap;gap:8px}
  .rule{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    border-radius:9999px;padding:6px 12px;font-size:12px}
  .rule i{width:7px;height:7px;border-radius:99px;display:inline-block}
  .rule.ok i{background:var(--green)}.rule.no i{background:var(--red)}.rule.un i{background:var(--muted)}
  /* notes */
  .notewrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .notelist{list-style:none;margin:0;padding:0;max-height:270px;overflow:hidden}
  .notelist.exp{max-height:none}
  .notelist li{display:grid;grid-template-columns:14px 1fr;gap:9px;padding:9px 11px;font-size:12.5px;
    line-height:1.6;color:var(--ink2);border-bottom:1px solid var(--line)}
  .notelist li:last-child{border-bottom:0}
  .notelist li::before{content:"•";color:var(--muted)}
  .notelist li.ok::before{content:"✓";color:var(--green);font-weight:800}
  .notelist li.warn::before{content:"!";color:var(--amber);font-weight:800}
  .notelist li.warn{background:rgba(255,194,71,.05)}
  .notelist li b{color:var(--ink);font-weight:700}
  .notelist li span{display:block;margin-top:1px}
  .morebtn{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line2);color:var(--ink2);
    border-radius:9px;padding:8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .morebtn:hover{color:var(--ink);border-color:var(--muted)}
  /* evidence */
  .evlist{display:flex;flex-direction:column;gap:7px}
  .ev{display:grid;grid-template-columns:110px 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font-size:12px}
  .ev .w{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
  .ev a{word-break:break-all}
  .ev .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .evall{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .promo{background:linear-gradient(135deg,rgba(231,70,148,.13),rgba(157,123,251,.10));
    border:1px solid rgba(231,70,148,.38);border-radius:12px;padding:13px 14px;margin-bottom:16px}
  .promo .ph{display:flex;align-items:center;gap:8px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--pink);font-weight:800;margin-bottom:9px}
  .promo .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:800;letter-spacing:.04em;
    background:var(--bg);border:1px dashed rgba(231,70,148,.55);border-radius:9px;padding:6px 12px;color:var(--ink)}
  .copy{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:8px;
    padding:6px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
  .copy:hover{color:var(--ink);border-color:var(--muted)}
  .pdesc{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.55}
  .exp{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:11px;font-weight:700}
  .exp.soon{background:rgba(255,194,71,.16);color:var(--amber)}
  .exp.done{background:rgba(255,107,94,.16);color:var(--red)}
  .exp.none{background:rgba(147,160,180,.16);color:var(--muted)}
  .tagpromo{display:inline-block;border-radius:5px;padding:1px 6px;font-size:9px;font-weight:800;letter-spacing:.05em;
    background:rgba(231,70,148,.16);color:var(--pink);margin-left:6px;vertical-align:middle}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .chart .cap{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.55}
  /* compare modal */
  .cmpmod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;padding:32px 16px;overflow:auto}
  .cmpmod.on{display:block}
  .cmpmod .panel{background:var(--bg);border:1px solid var(--line2);border-radius:16px;max-width:1180px;margin:0 auto}
  .cmpmod .head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
  .cmpmod h2{margin:0;font-size:17px}
  .cmpmod .head .x{margin-left:auto}
  .cmpgrid{overflow:auto}
  .cmprow{display:grid;grid-template-columns:180px repeat(var(--cols),minmax(190px,1fr));border-bottom:1px solid var(--line)}
  .cmprow > div{padding:10px 14px;font-size:12.5px;background:var(--panel)}
  .cmprow .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
    background:var(--panel2);position:sticky;left:0;display:flex;align-items:center}
  .cmprow .v.diff{background:rgba(231,70,148,.10);font-weight:700;color:var(--ink)}
  .cmphead .v{font-weight:800;font-size:13px;padding:14px}
  .cmphead .v small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
  footer{padding:26px 0 90px;color:var(--muted);font-size:12px;line-height:1.7;max-width:860px}
  @media(max-width:1080px){.shell{grid-template-columns:1fr}.filters{position:static}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<div class="top"><div class="in">
  <div class="brand"><div class="mark">H</div><div><b>SilentFam Helix</b><span id="brandSub"></span></div></div>
  <div class="grow"></div>
  <div class="meta"><span><b id="mRows">—</b> <span id="lRows"></span></span>
    <span><b id="mFirms">—</b> <span id="lFirms"></span></span></div>
  <div class="lang"><button data-lang="ko" class="on">KO</button><button data-lang="en">EN</button></div>
  <button class="iconbtn" id="theme" title="theme">☾</button>
</div></div>

<div class="shell">
  <aside class="filters">
    <h3 id="fTitle"></h3>
    <div class="fg"><label id="fFirmL"></label><div class="opts" id="fFirms"></div></div>
    <div class="fg"><label id="fMktL"></label><div class="opts" id="fMkts"></div></div>
    <div class="fg"><label id="fStepL"></label><div class="opts" id="fSteps"></div></div>
    <div class="fg"><label id="fDdL"></label><div class="opts" id="fDd"></div></div>
    <div class="fg"><label id="fVerL"></label><div class="opts" id="fVer"></div></div>
    <div class="fg"><label id="fFlagL"></label><div class="opts" id="fFlags"></div></div>
    <div class="fg"><label id="fSizeL"></label><div class="range"><input id="sizeMin" type="number"><span>–</span><input id="sizeMax" type="number"></div></div>
    <div class="fg"><label id="fPriceL"></label><div class="range"><input id="priceMax" type="number"><span id="priceUnit"></span></div></div>
    <button class="reset" id="reset"></button>
  </aside>

  <main>
    <h1 id="h1"></h1><p id="sub"></p>
    <div class="stats">
      <div class="stat"><div class="n" id="s1">—</div><div class="l" id="s1l"></div></div>
      <div class="stat"><div class="n" id="s2">—</div><div class="l" id="s2l"></div></div>
      <div class="stat"><div class="n" id="s3">—</div><div class="l" id="s3l"></div></div>
      <div class="stat"><div class="n" id="s4">—</div><div class="l" id="s4l"></div></div>
    </div>
    <div class="searchrow"><label class="search"><span class="dim">⌕</span><input id="q" autocomplete="off"></label>
      <span class="count" id="count"></span></div>
    <div class="card"><div class="scroll"><table><thead><tr>
      <th data-sort="f" id="thFirm"></th><th data-sort="p" id="thPlan"></th><th data-sort="mk" id="thMkt"></th>
      <th data-sort="s" class="num" id="thSize"></th><th data-sort="pr" class="num" id="thPrice"></th>
      <th data-sort="sp" class="num" id="thSplit"></th><th data-sort="dl" class="num" id="thDaily"></th>
      <th data-sort="ml" class="num" id="thMax"></th><th data-sort="tg" id="thTarget"></th>
      <th data-sort="dd" id="thDd"></th><th data-sort="ec" id="thEa"></th><th data-sort="vf" id="thVer"></th>
    </tr></thead><tbody id="tb"></tbody></table></div>
    <div class="empty" id="empty" style="display:none"></div></div>
    <footer id="foot"></footer>
  </main>
</div>

<div class="pop" id="pop"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead"><div class="t"><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div>
    <div id="dCta"></div><button class="iconbtn" id="dClose">✕</button></div>
  <div class="dbody" id="dBody"></div>
</aside>

<div class="cbar" id="cbar"><div class="in">
  <span style="font-size:12.5px;font-weight:700" id="cbarL"></span>
  <div id="cchips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <div class="grow"></div>
  <button class="btn g" id="cClear"></button>
  <button class="btn" id="cGo" disabled></button>

let lang = localStorage.getItem("helix-lang") || "ko";
let theme = localStorage.getItem("helix-theme") || "dark";

const F = {firm:new Set(),mk:new Set(),st:new Set(),dd:new Set(),vf:new Set(),flags:new Set(),
           sizeMin:null,sizeMax:null,priceMax:null};
const el=id=>document.getElementById(id);
const t=k=>(I18N[lang][k] ?? k);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(String(v).replace(/[,$%\s]/g,""));return isNaN(n)?null:n;};
const ok=v=>v===true;
const assetLabel=v=>(ASSET[lang]||ASSET.en)[v]||(v||"—").toUpperCase();
const enumv=v=>{if(v==null||v==="")return v;const m={ko:{instant:"즉시","1-step":"1단계","2-step":"2단계","3-step":"3단계",yes:"예",no:"아니오"},en:{yes:"yes",no:"no"}}[lang]||{};return m[v]||v;};
const pc=v=>(v==null||v===""||num(v)===0)?'<span class="dim">—</span>':`<span class="mono">${esc(v)}%</span>`;
function money(v,cur){if(v==null||v==="")return '<span class="dim">—</span>';const n=num(v);if(n==null)return esc(v);
  const sym=((cur||"").toUpperCase()==="USD"||!cur)?"$":"";return `<span class="mono">${sym}${n.toLocaleString('en-US')}</span>`;}

/* ---------- notes ---------- */
function notesBlock(txt){
  if(!txt) return `<div class="notewrap"><div class="notelist"><li>${esc(t("noNotes"))}</li></div></div>`;
  let parts = txt.split(/\s*\|\s*/).map(s=>s.trim()).filter(Boolean);
  if(parts.length < 2) parts = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const li = parts.map(p=>{
    const cls = /⚠/.test(p) ? "warn" : /✅/.test(p) ? "ok" : "";
    let body = p.replace(/^[✅⚠️❗❌🔴🟡✔✖\s]+/u,"");
    const m = body.match(/^([^:：]{1,26})[:：]\s*(.+)$/s);
    const html = m ? `<b>${esc(m[1])}</b><span>${esc(m[2])}</span>` : `<span>${esc(body)}</span>`;
    return `<li class="${cls}">${html}</li>`;
  }).join("");
  const long = parts.length > 4;
  return `<div class="notewrap"><ul class="notelist${long?"":""}" id="noteList">${li}</ul>` +
         (long?`<button class="morebtn" id="noteMore">${esc(t("more"))}</button>`:"") + `</div>`;
}

/* ---------- evidence ---------- */
function asUrl(s){
  if(!s) return null;
  s = String(s).trim();
  const m = s.match(/((?:[a-z0-9-]+\.)+[a-z]{2,})((?:\/[^\s]*)?)/i);
  if(m) return "https://" + m[1] + (m[2]||"");
  if(/^https?:\/\//i.test(s)) return s;
  return null;
}
function evidenceBlock(r){
  const items = [];
  const push=(lbl,val)=>{ if(!val) return; const u=asUrl(val);
    items.push({lbl, u, txt:String(val).trim()}); };
  push(t("evOfficial"), r.ur);
  push(t("evPay"), r.ps);
  push(t("evDd"), r.ds);
  push(t("evDays"), r.ms);
  push(t("evMt5"), r.m5s);
  push(t("evPayout"), r.ys);
  push(t("evRating"), r.rs);
  const meta = `<div class="ev"><div class="w">${esc(t("cVer"))}</div><div>` +
      `<span class="pill p-${esc(r.vf||"C")}">${esc(r.vf||"—")}</span> · ${esc(r.sy||"—")} · ${esc(t("evRecorded"))} ${esc(r.ao||"—")}</div></div>`;
  const list = items.map(it=>`<div class="ev"><div class="w">${esc(it.lbl)}</div><div>` +
      (it.u?`<a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.txt)}</a>`:`<span>${esc(it.txt)}</span>`) +
      `</div></div>`).join("");
  const miss = items.length<=1 ? `<div class="evall">${esc(t("evMissing"))}</div>` : "";
  return `<div class="evlist">${meta}${list}</div>${miss}<div class="evall">${esc(t("evHow"))}</div>`;
}

/* ---------- filters / table ---------- */
function matches(r){
  if(q){const h=(r.f+" "+r.p+" "+(r.pm||"")).toLowerCase();if(!h.includes(q))return false;}
  if(F.firm.size&&!F.firm.has(r.f))return false;
  if(F.mk.size&&!F.mk.has(r.mk))return false;
  if(F.st.size&&!F.st.has(r.st||"—"))return false;
  if(F.dd.size&&!F.dd.has(r.dd||"—"))return false;
  if(F.vf.size&&!F.vf.has(r.vf||"—"))return false;
  for(const f of F.flags){
    if(f==="promo"&&!(r.co||r.pt))return false;
    if(f==="ea"&&!(ok(r.ec)||r.ec==="cond"))return false;
    if(f==="news"&&!(ok(r.nc)||r.nc==="cond"))return false;
    if(f==="korea"&&r.kr!=="yes")return false;
    if(f==="on"&&!ok(r.oc))return false;
    if(f==="cp"&&!ok(r.cc))return false;
    if(f==="wk"&&!ok(r.wk))return false;
  }
  const s=num(r.s); if(F.sizeMin!=null&&(s==null||s<F.sizeMin))return false;
  if(F.sizeMax!=null&&(s==null||s>F.sizeMax))return false;
  const pr=num(r.pr); if(F.priceMax!=null&&(pr==null||pr>F.priceMax))return false;
  return true;
}
function chipRow(host,values,set,labelFn){
  host.innerHTML="";
  values.forEach(v=>{const b=document.createElement("button");
    b.className="opt"+(set.has(v)?" on":""); b.textContent=labelFn?labelFn(v):v;
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);render();}; host.appendChild(b);});
}
function buildFilters(){
  chipRow(el("fFirms"),DB.firms,F.firm);
  chipRow(el("fMkts"),DB.mkts,F.mk,v=>assetLabel(v));
  chipRow(el("fSteps"),DB.steps.concat(["—"]).filter((v,i,a)=>a.indexOf(v)===i),F.st,v=>enumv(v)||"—");
  chipRow(el("fDd"),DB.dd,F.dd);
  chipRow(el("fVer"),DB.tiers,F.vf);
  const flags=[["promo","fPromo"],["ea","fEa"],["news","fNews"],["korea","fKorea"],["on","fOn"],["cp","fCp"],["wk","fWk"]];
  const host=el("fFlags"); host.innerHTML="";
  flags.forEach(([k,lab])=>{const b=document.createElement("button");
    b.className="opt"+(F.flags.has(k)?" on":""); b.textContent=t(lab);
    b.onclick=()=>{F.flags.has(k)?F.flags.delete(k):F.flags.add(k);render();}; host.appendChild(b);});
}
function render(){
  const out=rows.filter(matches).sort((a,b)=>{
    const A=a[sortKey],B=b[sortKey];
    if(["s","pr","sp","dl","ml"].includes(sortKey))return ((num(A)??-1)-(num(B)??-1))*sortDir;
    return String(A??"").localeCompare(String(B??""))*sortDir;});
  el("tb").innerHTML=out.map(r=>{
    const g=r.vf||"—";
    const ea = ok(r.ec)?"yes":(r.ec===false?"no":"dim");
    return `<tr data-id="${esc(r.i)}" class="${activeId===r.i?"open":""}">
      <td class="firm">${esc(r.f)}</td>
      <td class="plan" title="${esc(r.p)}">${esc(r.p)}${(r.co||r.pt)?`<span class="tagpromo">PROMO</span>`:""}</td>
      <td><span class="tag t-${esc((r.mk||"").toLowerCase())}" title="${esc(ASSET_TIP[lang])}">${esc(assetLabel(r.mk))}</span></td>
      <td class="num">${money(r.s,r.cu)}</td>
      <td class="num">${money(r.pr,r.cu)}</td>
      <td class="num">${r.sp?`<span class="mono">${esc(r.sp)}%</span>`:'<span class="dim">—</span>'}</td>
      <td class="num">${pc(r.dl)}</td><td class="num">${pc(r.ml)}</td>
      <td class="mono">${r.tg==="0"||r.tg==null?'<span class="dim">—</span>':esc(r.tg)+"%"}</td>
      <td>${esc(r.dd||"—")}</td>
      <td>${ea==="yes"?'<span class="yes">✓</span>':ea==="no"?'<span class="no">✕</span>':`<span class="dim">${esc(r.ec==="cond"?"조건":"?")}</span>`}</td>
      <td><span class="pill p-${esc(g)}">${esc(g)}</span></td></tr>`;
  }).join("");
  document.querySelectorAll("#tb tr").forEach(tr=>{
    tr.onclick=()=>openDrawer(tr.dataset.id);
    tr.onmouseenter=ev=>showPop(tr.dataset.id, ev.currentTarget);
    tr.onmouseleave=hidePop;
  });
  document.querySelectorAll("thead th[data-sort]").forEach(th=>{
    th.querySelectorAll(".ar").forEach(a=>a.remove());
    if(th.dataset.sort===sortKey){const s=document.createElement("span");s.className="ar";
      s.textContent=sortDir>0?"▲":"▼";th.appendChild(s);}});
  el("empty").style.display=out.length?"none":"block";
  el("count").textContent=`${out.length.toLocaleString('en-US')} / ${rows.length.toLocaleString('en-US')}`;
  el("s4").textContent=rows.filter(r=>r.vf==="A").length.toLocaleString('en-US');
  buildFilters();
}

/* ---------- hover popover ---------- */
let popTimer=null;
function showPop(id, tr){
  clearTimeout(popTimer);
  const r=rows.find(x=>x.i===id); if(!r) return;
  const inSel=picked.has(id);
  el("pop").innerHTML=`
    <div class="ph">${esc(r.f)}</div>
    <div class="ps">${esc(r.p)} · ${r.s?Number(r.s).toLocaleString('en-US'):"—"} ${esc(r.cu||"")}</div>
    <div class="pg">
      <div class="pk"><div class="v">${r.pr!=null?"$"+Number(r.pr).toLocaleString('en-US'):"—"}</div><div class="l">${esc(t("fPrice"))}</div></div>
      <div class="pk"><div class="v">${r.sp?esc(r.sp)+"%":"—"}</div><div class="l">${esc(t("fSplit"))}</div></div>
    </div>
    <div class="pb">
      <button class="primary" data-add="${esc(r.i)}" ${inSel?"disabled":""}>${esc(inSel?t("popFull"):t("popAdd"))}</button>
      <button data-open="${esc(r.i)}">${esc(t("popOpen"))}</button>
    </div>`;
  const pop=el("pop");
  pop.classList.add("on");
  const b=tr.getBoundingClientRect();
  const w=296, h=pop.offsetHeight||170;
  let x=Math.min(b.right+10, window.innerWidth-w-12);
  let y=Math.min(Math.max(b.top-8, 74), window.innerHeight-h-16);
  pop.style.left=x+"px"; pop.style.top=y+"px";
  pop.querySelectorAll("[data-add]").forEach(btn=>btn.onclick=e=>{
    e.stopPropagation(); addPick(btn.dataset.add); hidePop(); render();
  });
  pop.querySelectorAll("[data-open]").forEach(btn=>btn.onclick=e=>{
    e.stopPropagation(); hidePop(); openDrawer(btn.dataset.open);
  });
}
function hidePop(){ popTimer=setTimeout(()=>el("pop").classList.remove("on"), 120); }

/* ---------- compare ---------- */
function addPick(id){
  if(picked.has(id)) return;
  if(picked.size>=4) return;
  picked.add(id); renderBar();
}
function renderBar(){
  const arr=[...picked];
  el("cbar").classList.toggle("on", arr.length>0);
  el("cchips").innerHTML=arr.map(id=>{
    const r=rows.find(x=>x.i===id); if(!r) return "";
    return `<span class="cchip"><b>${esc(r.f)}</b> ${esc(r.p)} <button data-rm="${esc(id)}">✕</button></span>`;
  }).join("");
  el("cchips").querySelectorAll("[data-rm]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); picked.delete(b.dataset.rm); renderBar(); render();});
  el("cbarL").textContent=t("cbarL");
  el("cClear").textContent=t("cbarClear");
  el("cGo").disabled=arr.length<2;
  el("cGo").textContent=arr.length<2?t("cbarPick"):`${t("cbarGo")} ${arr.length}`;
}
function openCompare(){
  const arr=[...picked].map(id=>rows.find(r=>r.i===id)).filter(Boolean);
  if(arr.length<2) return;
  const F=[["fFirm",r=>esc(r.f)],["fPlan",r=>esc(r.p)],["fSize",r=>money(r.s,r.cu)],
    ["fPrice",r=>money(r.pr,r.cu)],["fAct",r=>money(r.ac,r.cu)],["fTotal",r=>money(r.to,r.cu)],
    ["fSplit",r=>r.sp?esc(r.sp)+"%":'<span class="dim">—</span>'],["fDaily",r=>pc(r.dl)],
    ["fMax",r=>pc(r.ml)],["fTarget",r=>r.tg?esc(r.tg)+"%":'<span class="dim">—</span>'],
    ["fDd",r=>esc(r.dd||"—")],["fLev",r=>esc(r.lv||"—")],["fSteps",r=>esc(enumv(r.st)||"—")],
    ["fDays",r=>esc((r.mf??r.md)!=null?String(r.mf??r.md):"—")],["fCycle",r=>esc(r.pc||"—")],
    ["fEa",r=>r.ec===true?'<span class="yes">✓</span>':(r.ec===false?'<span class="no">✕</span>':'<span class="dim">조건/?</span>')],
    ["fNews",r=>r.nc===true?'<span class="yes">✓</span>':(r.nc===false?'<span class="no">✕</span>':'<span class="dim">조건/?</span>')],
    ["fKorea",r=>esc(enumv(r.kr)||"—")],["fVer",r=>`<span class="pill p-${esc(r.vf||"C")}">${esc(r.vf||"—")}</span>`],
    ["fSrc",r=>esc(r.sy||"—")],["fSite",r=>r.ur?`<a href="${esc(r.ur)}" target="_blank" rel="noopener">${esc(t("visit"))} ↗</a>`:'—']];
  el("cmpBody").style.setProperty("--cols",arr.length);
  el("cmpBody").innerHTML=
    `<div class="cmprow cmphead"><div class="k">${esc(t("fFirm"))}</div>`+
    arr.map(r=>`<div class="v">${esc(r.f)}<small>${esc(r.p)}</small></div>`).join("")+`</div>`+
    F.slice(1).map(([k,f])=>{
      const vals=arr.map(f); const diff=vals.some(v=>v!==vals[0]);
      return `<div class="cmprow"><div class="k">${esc(t(k))}</div>`+
        vals.map(v=>`<div class="v${diff?" diff":""}">${v}</div>`).join("")+`</div>`;
    }).join("");
  el("cmpTitle").textContent=t("cmpTitle");
  el("cmpmod").classList.add("on");
}

/* ---------- drawer ---------- */
function drawerRow(k,v){return `<div class="k">${esc(k)}</div><div>${v}</div>`;}
function ruleChip(label,v){
  const cls=v===true?"ok":(v===false?"no":"un");
  const txt=v===true?t("yes"):(v===false?t("no"):"조건/미확인");
  return `<span class="rule ${cls}"><i></i>${esc(label)} <b>${esc(txt)}</b></span>`;
}
function floorChart(kind){
  const y=kind==="Static"
    ? `<line x1="0" y1="58" x2="260" y2="58" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 3"/>`
    : `<path d="M0,58 L70,58 L70,44 L130,44 L130,30 L200,30 L200,58" fill="none" stroke="var(--red)" stroke-width="2"/>`;
  return `<div class="chart"><svg viewBox="0 0 260 78" width="100%" height="78" aria-hidden="true">
    <line x1="0" y1="20" x2="260" y2="20" stroke="var(--line2)"/>
    <text x="2" y="17" fill="var(--muted)" font-size="8">100%</text>
    <path d="M0,34 L40,22 L80,30 L120,18 L160,28 L200,22 L240,30" fill="none" stroke="var(--cyan)" stroke-width="2"/>
    ${y}<text x="2" y="72" fill="var(--muted)" font-size="8">92%</text></svg>
    <div class="cap">${esc(kind==="Static"?t("floorStatic"):t("floorTrail"))} · ${esc(t("floorNote"))}</div></div>`;
}
function dday(exp){
  if(!exp) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(exp+"T00:00:00");
  if(isNaN(d)) return null;
  return Math.round((d-t)/86400000);
}
function expiryChip(exp){
  if(!exp) return `<span class="exp none">${esc(t("pNoExpiry"))}</span>`;
  const n=dday(exp);
  if(n===null) return `<span class="exp none">${esc(exp)}</span>`;
  if(n<0) return `<span class="exp done">${esc(t("pExpired"))} · ${esc(exp)}</span>`;
  if(n===0) return `<span class="exp soon">${esc(t("pToday"))} · ${esc(exp)}</span>`;
  return `<span class="exp soon">${n}${esc(t("pDays"))} · ${esc(exp)}</span>`;
}
function promoBlock(r){
  const code=r.co||null, txt=r.pt||r.po||null, exp=r.px||null;
  if(!code && !txt) return `<div class="sect">${esc(t("sectPromo"))}</div>
    <div class="note" style="color:var(--muted)">${esc(t("pNone"))}</div>`;
  return `<div class="sect">${esc(t("sectPromo"))}</div>
    <div class="promo">
      <div class="ph">🏷 ${esc(t("sectPromo"))}</div>
      <div class="row">
        <span class="code" id="promoCode">${esc(code||t("pNoCode"))}</span>
        ${code?`<button class="copy" id="promoCopy">${esc(t("pCopy"))}</button>`:""}
        ${expiryChip(exp)}
      </div>
      ${txt?`<div class="pdesc">${esc(txt)}</div>`:""}
    </div>`;
}
function gradeWord(g){ return g==="A"?t("gA"):g==="B"?t("gB"):g==="C"?t("gC"):"—"; }
function pfmLink(r){
  const meta = (DB.firmMeta||{})[r.f];
  const slug = (meta&&meta.pfm) || r.pm;
  return slug ? `https://propfirmmatch.com/prop-firms/${slug}` : null;
}
function openDrawer(id){
  const r=rows.find(x=>x.i===id); if(!r) return;
  activeId=id;
  el("dTitle").innerHTML=`${esc(r.f)} <span class="pill p-${esc(r.vf||"C")}">${esc(t("grade"))} ${esc(r.vf||"—")}</span>`;
  const pl=pfmLink(r);
  el("dSub").innerHTML=`${esc(r.p)} · ${r.s?Number(r.s).toLocaleString('en-US'):"—"} ${esc(r.cu||"")} · ${esc(assetLabel(r.mk))}`+
    ` · <span class="dim">${esc(t("grade"))} ${esc(r.vf||"—")} ${esc(gradeWord(r.vf))}</span>`+
    (pl?` · <a href="${esc(pl)}" target="_blank" rel="noopener">PFM ↗</a>`:"");
  const kDays=(r.mf!=null?r.mf:r.md);
  el("dBody").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="v g">${r.tg?esc(r.tg)+"%":'<span class="dim">—</span>'}</div><div class="k">${esc(t("kTarget"))}</div></div>
      <div class="kpi"><div class="v r">${r.dl!=null?esc(r.dl)+"%":'<span class="dim">—</span>'}</div><div class="k">${esc(t("kDaily"))}</div></div>
      <div class="kpi"><div class="v a">${r.ml!=null?esc(r.ml)+"%":'<span class="dim">—</span>'}</div><div class="k">${esc(t("kMax"))}</div></div>
      <div class="kpi"><div class="v c">${kDays!=null?esc(kDays)+" d":'<span class="dim">—</span>'}</div><div class="k">${esc(t("kDays"))}</div></div>
    </div>
    ${promoBlock(r)}
    <div class="sect">${esc(t("sectCost"))}</div>
    <div class="kv">${drawerRow(t("cPrice"),money(r.pr,r.cu))}${drawerRow(t("cAct"),money(r.ac,r.cu))}
      ${drawerRow(t("cTotal"),money(r.to,r.cu))}${r.po?drawerRow(t("cPromo"),esc(r.po)):""}
      ${r.co?drawerRow(t("cCode"),`<b>${esc(r.co)}</b>`):""}</div>
    <div class="sect">${esc(t("sectCond"))}</div>
    <div class="kv">${drawerRow(t("cLev"),r.lv?esc(r.lv):'<span class="dim">—</span>')}
      ${drawerRow(t("cType"),esc(enumv(r.ty)||"—"))}${drawerRow(t("cStages"),r.sg!=null?esc(r.sg):'<span class="dim">—</span>')}
      ${drawerRow(t("cDays"),r.md!=null?esc(r.md):'<span class="dim">—</span>')}
      ${drawerRow(t("cKorea"),r.kr?esc(enumv(r.kr)):'<span class="dim">—</span>')}
      ${drawerRow(t("cMt5"),r.m5===true?"✓":(r.m5===false?"✕":'<span class="dim">?</span>'))}</div>
    <div style="margin-top:12px" class="rules">${ruleChip(t("fEa"),r.ec)}${ruleChip(t("fNews"),r.nc)}
      ${ruleChip(t("fOn"),r.oc)}${ruleChip(t("fCp"),r.cc)}${ruleChip(t("fWk"),r.wk)}</div>
    <div class="sect">${esc(t("sectPay"))}</div>
    <div class="kv">${drawerRow(t("cSplit"),r.sp?`<b>${esc(r.sp)}%</b>`:'<span class="dim">—</span>')}
      ${drawerRow(t("cCycle"),r.pc?esc(r.pc):'<span class="dim">—</span>')}
      ${drawerRow(t("cFirst"),r.pf?esc(r.pf):'<span class="dim">—</span>')}
      ${r.pn?drawerRow(t("cMin"),esc(r.pn)):""}
      ${drawerRow(t("cRating"),r.rt?`${esc(r.rt)} ★ <span class="dim">(${esc(r.rn||"—")})</span>`:'<span class="dim">—</span>')}
      ${r.yk!=null?drawerRow(t("cCap"),r.yk===0?esc("무제한"):money(r.yk,r.cu)+(r.ykn?` <span class="dim">${esc(r.ykn)}</span>`:"")):""}
      ${r.ym!=null?drawerRow(t("cMinPay"),money(r.ym,r.cu)):""}</div>
    <div class="sect">${esc(t("sectMore"))}</div>
    <div class="kv">
      ${drawerRow(t("cTargets"),(r.tx&&r.tx.length)?r.tx.map(v=>v+"%").join(" / ")+` <span class="dim">(${esc(r.sg||r.tx.length)}단계)</span>`:(r.tg?esc(r.tg)+"%":'<span class="dim">—</span>'))}
      ${drawerRow(t("cConsist"),r.cs?esc(r.cs):'<span class="dim">—</span>')}
      ${drawerRow(t("cStepDetail"),r.stp?esc(r.stp):'<span class="dim">—</span>')}
      ${drawerRow(t("cLeverageDetail"),r.lvp?esc(r.lvp):'<span class="dim">—</span>')}
      ${drawerRow(t("cPfmRef"),(r.dp!=null||r.mp!=null)?`${esc(r.dp??"—")}% / ${esc(r.mp??"—")}%`:'<span class="dim">—</span>')}
    </div>
    <div class="sect">${esc(t("sectFloor"))}</div>${floorChart(r.dd==="Trailing"?"Trailing":"Static")}
    <div class="sect">${esc(t("sectNotes"))}</div>${notesBlock(r.no)}
    <div class="sect">${esc(t("sectEv"))}</div>${evidenceBlock(r)}
    <div class="sect">${esc(t("sectSrc"))}</div>
    <div class="kv">${drawerRow(t("cVer"),`<span class="pill p-${esc(r.vf||"C")}">${esc(r.vf||"—")}</span>`)}
      ${drawerRow(t("cSrc"),esc(r.sy||"—"))}${drawerRow(t("cAsOf"),esc(r.ao||"—"))}
      ${drawerRow(t("cId"),`<span class="dim mono">${esc(r.i)}</span>`)}</div>`;
  const cp=el("promoCopy");
  if(cp) cp.onclick=()=>{
    const val=el("promoCode").textContent.trim();
    const done=()=>{cp.textContent=t("pCopied");setTimeout(()=>{cp.textContent=t("pCopy");},1400);};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(done,done);
    else done();
  };
  const mb=el("noteMore");
  if(mb) mb.onclick=()=>{const L=el("noteList");const exp=L.classList.toggle("exp");
    mb.textContent=exp?t("less"):t("more");};
  el("dCta").innerHTML=r.ur?`<a class="btn" href="${esc(r.ur)}" target="_blank" rel="noopener">${esc(t("visit"))} ↗</a>`:"";
  el("drawer").classList.add("on"); el("drawer").setAttribute("aria-hidden","false");
  el("scrim").classList.add("on");
  document.querySelectorAll("#tb tr").forEach(tr=>tr.classList.toggle("open",tr.dataset.id===id));
}
function closeDrawer(){el("drawer").classList.remove("on");el("drawer").setAttribute("aria-hidden","true");
  el("scrim").classList.remove("on");activeId=null;
  document.querySelectorAll("#tb tr.open").forEach(tr=>tr.classList.remove("open"));}

function applyTheme(){document.documentElement.setAttribute("data-theme",theme);
  el("theme").textContent=theme==="dark"?"☾":"☀";}
function applyStatics(){
  document.documentElement.lang=lang;
  document.title=lang==="ko"?"SilentFam Helix — 프랍펌 및 브로커 데이터베이스":"SilentFam Helix — prop firm & broker database";
  el("brandSub").textContent=t("brandSub");el("h1").textContent=t("h1");el("sub").textContent=t("sub");
  el("lRows").textContent=t("rows");el("lFirms").textContent=t("firms");
  el("mRows").textContent=rows.length.toLocaleString('en-US');el("mFirms").textContent=DB.firms.length;
  el("s1").textContent=rows.length.toLocaleString('en-US');el("s2").textContent=DB.firms.length;
  el("s3").textContent=DB.mkts.length;
  el("s1l").textContent=t("s1");el("s2l").textContent=t("s2");el("s3l").textContent=t("s3");el("s4l").textContent=t("s4");
  el("fTitle").textContent=t("filters");el("fFirmL").textContent=t("firm");el("fMktL").textContent=t("mkt");
  el("fStepL").textContent=t("step");el("fDdL").textContent=t("ddF");el("fVerL").textContent=t("ver");
  el("fFlagL").textContent=t("flags");el("fSizeL").textContent=t("size");el("fPriceL").textContent=t("price");
  el("priceUnit").textContent="USD";el("reset").textContent=t("reset");
  el("q").placeholder=t("search");el("empty").textContent=t("empty");
  el("thFirm").textContent=t("thFirm");el("thPlan").textContent=t("thPlan");el("thMkt").textContent=t("thMkt");
  el("thSize").textContent=t("thSize");el("thPrice").textContent=t("thPrice");el("thSplit").textContent=t("thSplit");
  el("thDaily").textContent=t("thDaily");el("thMax").textContent=t("thMax");el("thTarget").textContent=t("thTarget");
  el("thDd").textContent=t("thDd");el("thEa").textContent=t("thEa");el("thVer").textContent=t("thVer");
  el("foot").innerHTML=t("foot");
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  renderBar();
}
el("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("helix-theme",theme);applyTheme();};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang;localStorage.setItem("helix-lang",lang);
  applyStatics();render();if(activeId)openDrawer(activeId);});
el("q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();render();});
document.querySelectorAll("thead th[data-sort]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
["sizeMin","sizeMax","priceMax"].forEach(id=>el(id).addEventListener("input",e=>{
  const v=e.target.value===""?null:Number(e.target.value);
  if(id==="sizeMin")F.sizeMin=v;else if(id==="sizeMax")F.sizeMax=v;else F.priceMax=v;render();}));
el("reset").onclick=()=>{["firm","mk","st","dd","vf","flags"].forEach(k=>F[k].clear());
  F.sizeMin=F.sizeMax=F.priceMax=null;el("sizeMin").value="";el("sizeMax").value="";el("priceMax").value="";
  q="";el("q").value="";render();};
el("cGo").onclick=openCompare;
el("cClear").onclick=()=>{picked.clear();renderBar();render();};
el("cmpClose").onclick=()=>el("cmpmod").classList.remove("on");
el("cmpmod").onclick=e=>{if(e.target.id==="cmpmod")el("cmpmod").classList.remove("on");};
el("dClose").onclick=closeDrawer;el("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();el("cmpmod").classList.remove("on");}});
document.addEventListener("scroll",()=>hidePop(),true);

applyTheme();applyStatics();render();
</script>
</body></html>
